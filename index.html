<style>
:root{
  /* Paleta neutra: piedra cálida + azul pizarra (tomado del logo) y estados en tonos apagados */
  --accent:#2D4A6B; --accent-ink:#fff;
  --accent-soft:color-mix(in srgb,var(--accent) 9%,#fff);
  --accent-mid:color-mix(in srgb,var(--accent) 28%,#fff);
  --bg:#F4F2EE; --card:#fff; --ink:#22262B; --muted:#7D7A74; --line:#E4E0D8; --soft:#F9F8F5;
  --ok:#4F8A6B; --ok-soft:#E6F0EA; --warn:#B8893A; --warn-soft:#F5EDDD; --info:#4A6FA5; --info-soft:#E8EDF5;
  --serve:#7C6A9E; --serve-soft:#EEEAF4; --gold:#C9A961;
  --danger:#B04545; --r:18px; --shadow:0 8px 28px rgba(30,35,45,.07); --shadow-s:0 2px 8px rgba(30,35,45,.05);
  --display:'Fraunces',Georgia,serif; --body:'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
img{display:block}
h1,h2,h3{margin:0;line-height:1.15}
.display{font-family:var(--display);letter-spacing:.5px}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:12px} .b{font-weight:700} .center{text-align:center}
.row{display:flex;align-items:center;gap:10px} .wrap{flex-wrap:wrap} .grow{flex:1;min-width:0} .col{display:flex;flex-direction:column;gap:10px}
.sp{justify-content:space-between} .hide{display:none!important}
.mt{margin-top:14px} .mt2{margin-top:24px} .mb{margin-bottom:14px}

/* ---------- botones / inputs ---------- */
.btn{border:0;border-radius:14px;padding:12px 18px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--ink);color:#fff;transition:transform .12s,opacity .12s,box-shadow .2s;min-height:46px;text-decoration:none;white-space:nowrap}
.btn:active{transform:scale(.97)} .btn[disabled]{opacity:.45;pointer-events:none}
.btn.acc{background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 22%,transparent)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.soft{background:var(--accent-soft);color:var(--accent)}
.btn.ok{background:var(--ok)} .btn.warn{background:var(--warn)} .btn.info{background:var(--info)} .btn.danger{background:var(--danger)}
.btn.sm{padding:7px 12px;min-height:36px;border-radius:11px;font-size:13px}
.btn.block{width:100%}
.icon-btn{border:0;background:var(--soft);width:40px;height:40px;border-radius:12px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:18px}
label.f{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:12px 0 6px}
.inp{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:13px;background:#fff;outline:none;transition:border .15s,box-shadow .15s;font-size:16px}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
textarea.inp{min-height:84px;resize:vertical}
.chk{display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-size:14px}
.chk input{width:20px;height:20px;accent-color:var(--accent);margin-top:1px;flex:none}
.switch{position:relative;width:46px;height:28px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:#d9cfc4;border-radius:20px;transition:.2s;cursor:pointer}
.switch span:before{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch input:checked+span{background:var(--ok)} .switch input:checked+span:before{transform:translateX(18px)}

.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow-s);border:1px solid var(--line);padding:18px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;background:var(--soft);border:1px solid var(--line);font-size:13px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
button.chip{cursor:pointer}
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700}
.st-pendiente{background:var(--warn-soft);color:#8A6524}
.st-preparando{background:var(--info-soft);color:#3A5A8A}
.st-listo{background:var(--ok-soft);color:#3D6E54}
.st-sirviendo{background:var(--serve-soft);color:#5F4F80}
.st-entregado{background:#ECEAE6;color:#66625C}
.st-activo{background:var(--ok-soft);color:#3D6E54} .st-inactivo{background:#ECEAE6;color:#66625C} .st-rechazado{background:#F6E6E6;color:#8E3434}
.empty{text-align:center;padding:34px 16px;color:var(--muted)} .empty .e{font-size:44px;margin-bottom:6px}
.av{border-radius:50%;object-fit:cover;background:var(--accent-soft);flex:none}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;padding:9px 14px;border-radius:12px;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab.on{background:#fff;color:var(--ink);box-shadow:var(--shadow-s)}
.sec-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 0 10px}
.sec-title h3{font-size:17px}
hr.sep{border:0;border-top:1px dashed var(--line);margin:14px 0}

/* ---------- toasts / modales ---------- */
#toasts{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:8px;width:min(440px,92vw);pointer-events:none}
.toast{background:#2F3439;color:#fff;padding:13px 16px;border-radius:14px;box-shadow:var(--shadow);font-weight:600;font-size:14px;animation:tin .25s ease;pointer-events:auto}
.toast.ok{background:var(--ok)} .toast.err{background:var(--danger)} .toast.info{background:var(--info)}
@keyframes tin{from{opacity:0;transform:translateY(-10px)}}
.overlay{position:fixed;inset:0;background:rgba(30,20,10,.45);z-index:900;display:flex;align-items:flex-end;justify-content:center;animation:fin .2s}
@keyframes fin{from{opacity:0}}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:94vh;border-radius:24px 24px 0 0;display:flex;flex-direction:column;animation:sup .28s cubic-bezier(.2,.9,.3,1.1);overflow:hidden}
.sheet.wide{max-width:860px}
@keyframes sup{from{transform:translateY(40px);opacity:.4}}
.sheet-h{padding:16px 18px 10px;display:flex;align-items:center;gap:10px;background:var(--bg)}
.sheet-h h2{font-size:20px;flex:1}
.sheet-b{padding:4px 18px 18px;overflow:auto;flex:1;-webkit-overflow-scrolling:touch}
.sheet-f{padding:12px 18px calc(12px + var(--safe-b));background:#fff;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center}
@media(min-width:700px){.overlay{align-items:center}.sheet{border-radius:24px;max-height:88vh}}

/* ---------- login ---------- */
.auth{min-height:100vh;display:grid;grid-template-columns:1fr}
.hero{position:relative;overflow:hidden;background:radial-gradient(110% 80% at 15% 0%,#FFFFFF 0%,#F7F5F1 45%,#ECE8E1 100%);color:var(--ink);padding:40px 24px 70px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:300px;border-bottom:1px solid var(--line)}
.hero:before{content:"";position:absolute;inset:0;background-image:radial-gradient(circle,rgba(45,74,107,.07) 1px,transparent 1.5px);background-size:22px 22px;pointer-events:none}
.hero .logo-wide{position:relative;width:min(440px,84vw);height:auto;filter:drop-shadow(0 10px 24px rgba(30,40,60,.10));animation:logoin .8s cubic-bezier(.2,.9,.3,1.1)}
@keyframes logoin{from{opacity:0;transform:translateY(10px) scale(.97)}}
.hero .logo-big{width:118px;height:118px;border-radius:30px;background:var(--accent);color:#fff;margin-bottom:16px;display:flex;align-items:center;justify-content:center;font-size:56px}
.hero h1{font-family:var(--display);font-size:clamp(40px,9vw,72px);font-weight:800;letter-spacing:4px;color:var(--accent)}
.hero p{position:relative;margin:14px 0 0;color:var(--muted);font-size:13px;letter-spacing:4px;text-transform:uppercase;font-weight:700;display:flex;align-items:center;gap:12px}
.hero p:before,.hero p:after{content:"";width:34px;height:1px;background:var(--gold)}
.floaty{position:absolute;font-size:30px;opacity:.28;animation:fl 9s ease-in-out infinite;filter:saturate(.75)}
@keyframes fl{50%{transform:translateY(-18px) rotate(8deg)}}
.auth-panel{padding:0 16px 40px;margin-top:-40px;position:relative;z-index:2}
.auth-card{max-width:440px;margin:0 auto;background:#fff;border-radius:26px;box-shadow:0 18px 50px rgba(30,40,60,.10);border:1px solid var(--line);padding:22px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border-radius:14px;padding:4px;gap:4px;border:1px solid var(--line)}
.seg button{border:0;background:transparent;padding:10px;border-radius:11px;font-weight:700;color:var(--muted);cursor:pointer}
.seg button.on{background:#fff;color:var(--ink);box-shadow:var(--shadow-s)}
.pin-boxes{display:flex;gap:8px;justify-content:center;margin:14px 0}
.pin-boxes input{width:46px;height:56px;text-align:center;font-size:24px;font-weight:800;border:1.5px solid var(--line);border-radius:13px;outline:none}
.pin-boxes input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.demo-bar{background:#2F3439;color:#fff;font-size:12px;text-align:center;padding:6px;letter-spacing:.5px}
.demo-bar b{color:var(--gold)}
@media(min-width:960px){
  .auth{grid-template-columns:1.1fr 1fr}
  .hero{min-height:100vh;padding:40px;border-bottom:0;border-right:1px solid var(--line)}
  .auth-panel{background:var(--bg)}
  .auth-panel{margin:0;display:flex;align-items:center;justify-content:center;padding:40px}
  .auth-card{width:100%}
}

/* ---------- registro ---------- */
.steps{display:flex;gap:6px;margin:4px 0 16px}
.steps i{flex:1;height:5px;border-radius:5px;background:var(--line);transition:.3s}
.steps i.on{background:var(--accent)}
.step-anim{animation:stin .35s ease}
@keyframes stin{from{opacity:0;transform:translateX(18px)}}
.reg-title{font-family:var(--display);font-size:26px;margin-bottom:4px}
.cam-wrap{display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:10px}
.cam-ring{width:224px;height:224px;border-radius:50%;padding:7px;background:conic-gradient(from 0deg,#2D4A6B,#7FB3CF,#9BC36B,#E9A65A,#2D4A6B);animation:spin 6s linear infinite;position:relative}
.cam-ring.done{animation:none;background:var(--ok)}
@keyframes spin{to{filter:hue-rotate(360deg)}}
.cam-circle{width:100%;height:100%;border-radius:50%;overflow:hidden;background:#fff;position:relative;border:5px solid #fff}
.cam-circle video,.cam-circle img{width:100%;height:100%;object-fit:cover}
.cam-circle video{transform:scaleX(-1)}
.cam-ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);font-weight:600;gap:4px;background:var(--soft)}
.cam-ph .e{font-size:56px;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) scale(1.05)}}
.cam-count{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:84px;font-weight:800;color:#fff;text-shadow:0 4px 20px rgba(0,0,0,.4);pointer-events:none}
.cam-flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.cam-flash.go{animation:flash .5s}
@keyframes flash{0%{opacity:1}100%{opacity:0}}
.cam-ok{position:absolute;right:6px;bottom:10px;background:var(--ok);color:#fff;width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;border:4px solid #fff;animation:pop .4s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(0)}}
.why{background:var(--accent-soft);border-radius:16px;padding:12px 14px;font-size:14px;display:flex;gap:10px}
.why .e{font-size:22px}
.method{border:2px solid var(--line);border-radius:18px;padding:16px;cursor:pointer;transition:.2s;background:#fff;position:relative}
.method.on{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.method .mt-h{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px}
.method .mt-h .e{font-size:26px}
.method .tag{position:absolute;top:-10px;right:14px;background:var(--ok);color:#fff;font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px}
.method ul{margin:10px 0 0;padding-left:18px;font-size:13.5px;color:#5b524b}
.method li{margin:3px 0}
.risk{background:var(--warn-soft);border-radius:14px;padding:12px;font-size:13.5px;margin-top:10px;color:#6E5220}
.meter{height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;transition:.3s}
.success{text-align:center;padding:16px 4px}
.success .big{width:96px;height:96px;border-radius:50%;background:var(--ok);color:#fff;font-size:50px;display:flex;align-items:center;justify-content:center;margin:6px auto 16px;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.confetti{position:fixed;top:-20px;font-size:22px;z-index:9998;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}

/* ---------- shell ---------- */
.shell{min-height:100vh}
.rail{display:none}
.topbar{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:10px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800}
.brand .lg{width:38px;height:38px;border-radius:11px;object-fit:cover;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px}
.brand .lgw{height:32px;width:auto;max-width:170px;object-fit:contain}
.rail .brand .lgw{height:auto;width:100%;max-width:200px}
.brand .sb2{font-size:10.5px;color:var(--muted);font-weight:700;letter-spacing:2px;text-transform:uppercase;margin-top:4px}
.brand .nm{font-family:var(--display);font-size:19px;letter-spacing:1.5px;line-height:1}
.brand .sb{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.5px}
main#main{padding:16px 16px calc(96px + var(--safe-b));max-width:1180px;margin:0 auto}
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:60;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + var(--safe-b));box-shadow:0 -6px 20px rgba(0,0,0,.04)}
.bottomnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--muted);text-decoration:none;padding:4px 0;border-radius:12px;max-width:96px}
.bottomnav a .i{font-size:21px;line-height:1.2;transition:transform .2s}
.bottomnav a.on{color:var(--accent)} .bottomnav a.on .i{transform:translateY(-2px) scale(1.12)}
@media(min-width:900px){
  .shell{display:grid;grid-template-columns:240px 1fr}
  .rail{display:flex;flex-direction:column;gap:4px;color:var(--ink);position:sticky;top:0;height:100vh;padding:20px 14px;border-right:1px solid var(--line);background:#fff}
  .rail .brand{padding:4px 8px 18px}
  .rail a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:13px;text-decoration:none;color:#4d443d;font-weight:700}
  .rail a .i{font-size:19px;width:24px;text-align:center}
  .rail a.on{background:var(--accent-soft);color:var(--accent)}
  .rail a:hover:not(.on){background:var(--soft)}
  .rail .me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;background:var(--soft);cursor:pointer}
  .topbar,.bottomnav{display:none}
  main#main{padding:28px 32px 40px}
}
body.kiosk .rail,body.kiosk .topbar,body.kiosk .bottomnav,body.kiosk .demo-bar{display:none!important}
body.kiosk .shell{display:block} body.kiosk main#main{max-width:none;padding:14px}

/* ---------- pedir ---------- */
.hello{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.hello h1{font-family:var(--display);font-size:clamp(24px,5vw,32px)}
.ready-banner{display:flex;align-items:center;gap:14px;background:var(--ok);color:#fff;border-radius:20px;padding:16px 18px;margin:12px 0;box-shadow:0 10px 30px rgba(79,138,107,.30);animation:pulse 2s infinite}
.ready-banner .e{font-size:34px}
@keyframes pulse{50%{box-shadow:0 10px 40px rgba(79,138,107,.55)}}
.daystrip{display:flex;gap:8px;overflow-x:auto;padding:6px 2px 10px;scroll-snap-type:x mandatory;scrollbar-width:none}
.daystrip::-webkit-scrollbar{display:none}
.wk-lbl{writing-mode:vertical-rl;transform:rotate(180deg);font-size:11px;font-weight:800;color:var(--muted);letter-spacing:1px;text-transform:uppercase;padding:0 2px;flex:none}
.day{flex:none;width:66px;border:1.5px solid var(--line);background:#fff;border-radius:18px;padding:9px 4px;text-align:center;cursor:pointer;scroll-snap-align:start;transition:.15s;position:relative}
.day .dn{font-size:12px;font-weight:700;color:var(--muted);text-transform:capitalize}
.day .dd{font-size:22px;font-weight:800;font-family:var(--display)}
.day .dots{display:flex;gap:3px;justify-content:center;height:6px;margin-top:2px}
.day .dots i{width:6px;height:6px;border-radius:50%;background:var(--ok)}
.day.on{background:var(--accent);color:#fff;border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--shadow)}
.day.on .dn{color:#c9d3df}
.day.today:after{content:"HOY";position:absolute;top:-8px;left:50%;transform:translateX(-50%);background:var(--gold);color:#fff;font-size:9px;font-weight:800;padding:2px 6px;border-radius:6px}
.meal{background:#fff;border-radius:22px;border:1px solid var(--line);box-shadow:var(--shadow-s);overflow:hidden;margin-bottom:14px}
.meal-h{display:flex;align-items:center;gap:12px;padding:16px 18px}
.meal-h .e{font-size:30px;width:52px;height:52px;border-radius:16px;background:var(--soft);display:flex;align-items:center;justify-content:center;flex:none}
.meal-h h3{font-size:18px}
.meal-b{padding:0 18px 18px}
.peek{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 14px}
.olist{list-style:none;margin:0;padding:0}
.olist li{display:flex;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);align-items:baseline}
.olist li:last-child{border:0}
.olist .q{font-weight:800;color:var(--accent);min-width:26px}
.note{background:#F7F0DF;border-radius:12px;padding:9px 12px;font-size:13.5px;margin-top:8px;color:#6A5528}
.lockmsg{border-radius:14px;padding:11px 14px;font-weight:600;font-size:14px;margin-top:10px}
.grid-meals{display:grid;gap:14px}
@media(min-width:900px){.grid-meals{grid-template-columns:1fr 1fr;align-items:start}}

/* editor de pedido */
.cat-h{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;margin:18px 0 8px}
.dish{display:flex;align-items:center;gap:12px;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:12px 12px 12px 14px;margin-bottom:8px;transition:.15s}
.dish.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 4%,#fff)}

<body>
<div id="app"></div>
<div id="toasts"></div>
<div id="modals"></div>
<script>
'use strict';
/* =====================================================================
   UTILIDADES
   ===================================================================== */
const DEMO = !CONFIG.SUPABASE_URL;
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const pd = s => { const [y, m, d] = String(s).slice(0, 10).split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const isoDow = d => ((d.getDay() + 6) % 7) + 1;
const weekStart = d => { const x = new Date(d); x.setHours(0, 0, 0, 0); return addDays(x, 1 - isoDow(x)); };
const hoy = () => ymd(new Date());
const DN = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];
const DNL = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
const MN = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
const MNL = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
const fLarga = s => { const d = pd(s); return `${DNL[d.getDay()]} ${d.getDate()} de ${MNL[d.getMonth()]}`; };
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const fCorta = s => { const d = pd(s); return `${DN[d.getDay()]} ${d.getDate()} ${MN[d.getMonth()]}`; };
const money = n => (S.cfg.moneda || '₡') + Number(n || 0).toLocaleString('es-CR', { maximumFractionDigits: 0 });
const hora12 = t => { if (!t) return ''; let [h, m] = t.split(':').map(Number); const ap = h >= 12 ? 'p. m.' : 'a. m.'; h = h % 12 || 12; return `${h}:${String(m).padStart(2, '0')} ${ap}`; };
const minsDesde = iso => Math.max(0, Math.floor((Date.now() - new Date(iso).getTime()) / 60000));
const dur = ms => { const m = Math.round(ms / 60000); if (m < 60) return `${m} min`; const h = Math.floor(m / 60); return `${h} h ${m % 60 ? (m % 60) + ' min' : ''}`.trim(); };
const meses = () => { const d = S.cfg.sesion_dias || 60; return d % 30 === 0 ? (d / 30 === 1 ? '1 mes' : `${d / 30} meses`) : `${d} días`; };
const initials = (n, a) => ((n || '?')[0] + (a || '')[0] || '').toUpperCase();
const sleep = ms => new Promise(r => setTimeout(r, ms));

function toast(msg, type = '', ms = 3200) {
  const t = document.createElement('div'); t.className = 'toast ' + type; t.textContent = msg;
  $('#toasts').appendChild(t); setTimeout(() => t.remove(), ms);
}
function confetti(n = 40) {
  const em = ['✨', '🍳', '🥑', '🍅', '🧀', '☕', '🥐', '🌿'];
  for (let i = 0; i < n; i++) {
    const c = document.createElement('div'); c.className = 'confetti'; c.textContent = em[i % em.length];
    c.style.left = Math.random() * 100 + 'vw'; c.style.animationDuration = 2 + Math.random() * 2.5 + 's';
    c.style.animationDelay = Math.random() * .6 + 's'; document.body.appendChild(c); setTimeout(() => c.remove(), 5500);
  }
}
let audioCtx;
function beep(times = 2) {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    for (let i = 0; i < times; i++) {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.type = 'sine';
      o.frequency.value = i % 2 ? 1320 : 880; o.connect(g); g.connect(audioCtx.destination);
      const t = audioCtx.currentTime + i * .22; g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.35, t + .02);
      g.gain.exponentialRampToValueAtTime(.0001, t + .2); o.start(t); o.stop(t + .21);
    }
  } catch (e) { }
}

/* ---------- modales ---------- */
function openModal(html, { wide = false, onClose, locked = false } = {}) {
  const ov = document.createElement('div'); ov.className = 'overlay';
  ov.innerHTML = `<div class="sheet ${wide ? 'wide' : ''}">${html}</div>`;
  if (!locked) ov.addEventListener('click', e => { if (e.target === ov) closeModal(ov); });
  ov._onClose = onClose; $('#modals').appendChild(ov); document.body.style.overflow = 'hidden'; return ov;
}
function closeModal(ov) {
  ov = ov || $('#modals').lastElementChild; if (!ov) return;
  ov._onClose && ov._onClose(); ov.remove();
  if (!$('#modals').children.length) document.body.style.overflow = '';
}
function closeAllModals() { while ($('#modals').lastElementChild) closeModal(); }
function confirmar(titulo, texto, okTxt = 'Confirmar', cls = 'acc') {
  return new Promise(res => {
    const ov = openModal(`<div class="sheet-h"><h2>${titulo}</h2></div><div class="sheet-b"><p>${texto}</p></div>
      <div class="sheet-f"><button class="btn ghost grow" id="cfNo">Cancelar</button><button class="btn ${cls} grow" id="cfSi">${okTxt}</button></div>`,
      { onClose: () => res(false) });
    $('#cfNo', ov).onclick = () => closeModal(ov);
    $('#cfSi', ov).onclick = () => { ov._onClose = null; closeModal(ov); res(true); };
  });
}
function pedirTexto(titulo, label, valor = '') {
  return new Promise(res => {
    const ov = openModal(`<div class="sheet-h"><h2>${titulo}</h2></div><div class="sheet-b"><label class="f">${label}</label><textarea class="inp" id="ptx">${esc(valor)}</textarea></div>
      <div class="sheet-f"><button class="btn ghost grow" id="ptNo">Cancelar</button><button class="btn acc grow" id="ptSi">Aceptar</button></div>`, { onClose: () => res(null) });
    $('#ptNo', ov).onclick = () => closeModal(ov);
    $('#ptSi', ov).onclick = () => { const v = $('#ptx', ov).value; ov._onClose = null; closeModal(ov); res(v); };
  });
}

/* ---------- imágenes ---------- */
function loadImg(src) { return new Promise((ok, ko) => { const i = new Image(); i.onload = () => ok(i); i.onerror = ko; i.src = src; }); }
function fileToDataURL(f) { return new Promise((ok, ko) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = ko; r.readAsDataURL(f); }); }
// Recorta al centro en cuadrado y comprime (foto de perfil ≈ 20-30 KB)
async function comprimir(src, size = 320, type = 'image/jpeg', q = .72) {
  const img = typeof src === 'string' ? await loadImg(src) : src;
  const w = img.videoWidth || img.naturalWidth || img.width, h = img.videoHeight || img.naturalHeight || img.height;
  const s = Math.min(w, h), c = document.createElement('canvas'); c.width = c.height = size;
  const ctx = c.getContext('2d'); if (type === 'image/jpeg') { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, size, size); }
  ctx.drawImage(img, (w - s) / 2, (h - s) / 2, s, s, 0, 0, size, size);
  return c.toDataURL(type, q);
}
// Logo: conserva proporción (no recorta), máx. 900×400
async function comprimirLogo(src, maxW = 900, maxH = 400) {
  const img = await loadImg(src), k = Math.min(1, maxW / img.naturalWidth, maxH / img.naturalHeight);
  const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); return c.toDataURL('image/webp', .9);
}
function avatarSVG(nombre, apellidos, hue) {
  hue = hue ?? ([...(nombre + apellidos)].reduce((a, c) => a + c.charCodeAt(0), 0) % 360);
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="hsl(${hue},55%,82%)"/><circle cx="50" cy="40" r="19" fill="hsl(${hue},45%,62%)"/><path d="M15 100c4-22 18-32 35-32s31 10 35 32z" fill="hsl(${hue},45%,62%)"/><text x="50" y="47" font-family="Arial" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">${initials(nombre, apellidos)}</text></svg>`;
  return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
}

/* =====================================================================
   API (Supabase RPC) — en modo demo usa un backend simulado local
   ===================================================================== */
const ERR = {
  SESION_INVALIDA: 'Tu sesión venció. Ingresa de nuevo.', SIN_PERMISO: 'No tienes permiso para esta acción.',
  NO_REGISTRADO: 'Ese correo no está registrado. ¿Quieres registrarte?', PENDIENTE: 'Tu solicitud aún está pendiente de aprobación. Te avisaremos por correo.',
  RECHAZADO: 'Tu solicitud de registro no fue aprobada. Puedes registrarte de nuevo.', INACTIVO: 'Tu cuenta está inactiva. Contacta a un administrador.',
  ESPERA: 'Espera unos segundos antes de pedir otro PIN.', PIN_VENCIDO: 'El PIN venció. Pide uno nuevo.',
  PIN_BLOQUEADO: 'Demasiados intentos. Pide un PIN nuevo.', PIN_INVALIDO: 'PIN incorrecto. Revisa tu correo e intenta de nuevo.',
  CREDENCIALES: 'Usuario o contraseña incorrectos.', BLOQUEADO: 'Demasiados intentos fallidos. Espera 15 minutos o entra con PIN.',
  CORREO_EXISTE: 'Ese correo ya tiene una cuenta asociada.', USUARIO_EXISTE: 'Ese nombre de usuario ya está en uso.',
  CORREO_INVALIDO: 'Revisa el formato del correo.', FOTO_REQUERIDA: 'Falta tu fotografía.', DATOS_INCOMPLETOS: 'Completa nombre y apellidos.',
  USUARIO_REQUERIDO: 'Elige un nombre de usuario.', PASSWORD_CORTA: 'La contraseña debe tener al menos 8 caracteres.',
  PASSWORD_ACTUAL: 'La contraseña actual no es correcta.', PASSWORD_REQUERIDA: 'Primero crea una contraseña.',
  CORTE: 'Ya pasó la hora de corte para este tiempo de comida.', PEDIDO_EN_COCINA: 'La cocina ya tomó este pedido; ya no se puede editar.',
  FECHA_PASADA: 'No se puede pedir para una fecha pasada.', NO_DISPONIBLE: 'Uno de los platos ya no está disponible ese día.',
  TIEMPO_INVALIDO: 'Ese tiempo de comida no está disponible.', TRANSICION_INVALIDA: 'Ese cambio de estado no está permitido.',
  SOLO_SERVICIO: 'Solo se puede editar cuando el pedido está listo o en servicio.', TIENE_PEDIDOS: 'Tiene pedidos registrados: mejor desactívelo.',
  NO_QUITAR_ADMIN_PROPIO: 'No puedes quitarte el rol de admin a ti mismo.', NO_ELIMINAR_PROPIO: 'No puedes eliminar tu propia cuenta.'
};
function errMsg(e) {
  const m = String(e?.message || e || '');
  if (m.startsWith('AGOTADO:')) return `“${m.slice(8)}” se agotó. Elige otra opción.`;
  if (/Failed to fetch|NetworkError/i.test(m)) return 'Sin conexión. Revisa tu internet.';
  return ERR[m] || m || 'Ocurrió un error';
}
async function rpc(fn, args = {}) {
  if (S.token && !('p_token' in args) && !['bistro_config_publica', 'bistro_registrar', 'bistro_pin_solicitar', 'bistro_pin_verificar', 'bistro_login_pass'].includes(fn)) args = { p_token: S.token, ...args };
  let data;
  if (DEMO) {
    await sleep(120);
    try { data = JSON.parse(JSON.stringify(Demo[fn](args) ?? null)); }
    catch (e) { handleErr(e); throw e; }
  } else {
    const r = await fetch(`${CONFIG.SUPABASE_URL}/rest/v1/rpc/${fn}`, {
      method: 'POST',
      headers: { apikey: CONFIG.SUPABASE_ANON_KEY, ...(CONFIG.SUPABASE_ANON_KEY.startsWith('eyJ') ? { Authorization: `Bearer ${CONFIG.SUPABASE_ANON_KEY}` } : {}), 'Content-Type': 'application/json' },
      body: JSON.stringify(args)
    });
    const txt = await r.text(); try { data = txt ? JSON.parse(txt) : null; } catch { data = txt; }
    if (!r.ok) { const e = new Error(data?.message || txt || r.statusText); handleErr(e); throw e; }
  }
  if (data && typeof data === 'object' && !Array.isArray(data) && data.error) { const e = new Error(data.error); throw e; }
  return data;
}
function handleErr(e) {
  if (String(e.message) === 'SESION_INVALIDA' && S.user) {
    localStorage.removeItem('bistro_token'); S.user = null; S.token = null; toast(ERR.SESION_INVALIDA, 'err'); boot();
  }
}

/* ---------- fotos (caché en memoria; se piden solo las que faltan) ---------- */
async function cargarFotos(lista) {
  const falt = [...new Map(lista.filter(x => x && x.usuario_id && (!S.fotos[x.usuario_id] || S.fotos[x.usuario_id].v !== x.foto_v)).map(x => [x.usuario_id, x])).keys()];
  if (!falt.length) return;
  try {
    const r = await rpc('bistro_fotos', { p_ids: falt });
    r.forEach(f => { S.fotos[f.id] = { v: f.foto_v, src: f.foto }; });
    falt.forEach(id => { if (!S.fotos[id]) S.fotos[id] = { v: -1, src: null }; });
    $$('img[data-uid]').forEach(img => { const f = S.fotos[img.dataset.uid]; if (f?.src && img.src !== f.src) img.src = f.src; });
  } catch (e) { }
}
const fotoImg = (uid, nombre, apellidos, cls = 'av', size = 48) =>
  `<img class="${cls}" data-uid="${uid}" style="width:${size}px;height:${size}px" src="${S.fotos[uid]?.src || avatarSVG(nombre, apellidos)}" alt="">`;

/* =====================================================================
   ARRANQUE
   ===================================================================== */
async function boot() {
  clearTimers(); closeAllModals(); document.body.className = '';
  try { S.cfg = await rpc('bistro_config_publica') || {}; } catch (e) { S.cfg = {}; }
  aplicarMarca();
  S.token = localStorage.getItem('bistro_token');
  if (S.token) {
    try {
      const r = await rpc('bistro_sesion', { p_token: S.token });
      S.user = r.usuario; S.cfg = r.config; S.expira = r.expira; aplicarMarca();
      if (S.user.foto_v) cargarFotos([{ usuario_id: S.user.id, foto_v: S.user.foto_v }]);
      route(); if (S.user.debe_cambiar) forzarCambioPassword(); return;
    } catch (e) { localStorage.removeItem('bistro_token'); S.token = null; }
  }
  S.user = null; renderLogin();
}
function sesionIniciada(r) {
  S.token = r.token; S.user = r.usuario; S.expira = r.expira; localStorage.setItem('bistro_token', r.token);
  localStorage.setItem('bistro_ultimo', JSON.stringify({ correo: r.usuario.correo, usuario: r.usuario.usuario, metodo: r.usuario.metodo }));
  toast(`¡Hola, ${r.usuario.nombre}! 👋`, 'ok'); boot();
}
async function logout() {
  try { await rpc('bistro_logout'); } catch (e) { }
  localStorage.removeItem('bistro_token'); S.user = null; S.token = null; location.hash = ''; boot();
}
window.addEventListener('hashchange', () => { if (S.user) route(); });

/* =====================================================================
   LOGIN
   ===================================================================== */
const L = { modo: 'ingresar', metodo: 'pin', paso: 'correo', correo: '' };
function renderLogin() {
  const ult = JSON.parse(localStorage.getItem('bistro_ultimo') || 'null');
  if (ult && !L._init) { L.metodo = ult.metodo || 'pin'; L.correo = ult.correo || ''; L.usuario = ult.usuario || ''; }
  L._init = true;
  // emojis solo en los bordes para no tapar el logo
  const pos = [[6, 12], [86, 10], [4, 70], [90, 62], [16, 88], [78, 86], [50, 6], [46, 92]];
  const floaties = ['🥐', '☕', '🍳', '🥗', '🍛', '🥑', '🍅', '🧀'].map((e, i) =>
    `<span class="floaty" style="left:${pos[i][0]}%;top:${pos[i][1]}%;animation-delay:${i * .7}s">${e}</span>`).join('');
  $('#app').innerHTML = `${DEMO ? '<div class="demo-bar"><b>MODO DEMO</b> · datos de prueba guardados solo en este navegador · configure Supabase en CONFIG para producción</div>' : ''}
  <div class="auth">
    <section class="hero">${floaties}
      <img class="logo-wide" src="${logoSrc()}" alt="${esc(S.cfg.app_nombre || 'ASETICINO')}">
      <p>${esc(S.cfg.subtitulo || 'Bistró Legrand')}</p>
    </section>
    <section class="auth-panel"><div class="auth-card" id="authCard"></div></section>
  </div>`;
  drawAuthCard();
}
function drawAuthCard() {
  const c = $('#authCard'); if (!c) return;
  if (L.modo === 'registro') return drawRegistro(c);
  let body = '';
  if (L.metodo === 'pin') {
    if (L.paso === 'correo') body = `
      <label class="f">Tu correo</label>
      <input class="inp" id="lgCorreo" type="email" inputmode="email" autocomplete="email" placeholder="nombre@empresa.com" value="${esc(L.correo)}">
      <button class="btn acc block mt" id="lgPinBtn">📩 Enviarme un PIN</button>
      <p class="tiny muted center mt">Te llegará un código de 6 dígitos. Tu sesión dura ${meses()}.</p>`;
    else body = `
      <p class="center" style="margin:6px 0 0">Escribe el PIN que enviamos a<br><b>${esc(L.correo)}</b></p>
      <div class="pin-boxes" id="pinBoxes">${[0, 1, 2, 3, 4, 5].map(i => `<input inputmode="numeric" maxlength="1" ${i === 0 ? 'autocomplete="one-time-code"' : ''} data-i="${i}">`).join('')}</div>
      <button class="btn acc block" id="lgVerBtn">Ingresar</button>
      <div class="row sp mt small"><a href="#" id="lgOtro" class="muted">← Cambiar correo</a><a href="#" id="lgReenv" style="color:var(--accent);font-weight:700">Reenviar PIN</a></div>`;
  } else body = `
      <label class="f">Usuario o correo</label>
      <input class="inp" id="lgUsr" autocomplete="username" autocapitalize="off" value="${esc(L.usuario || '')}">
      <label class="f">Contraseña</label>
      <div style="position:relative"><input class="inp" id="lgPass" type="password" autocomplete="current-password">
      <button class="icon-btn" style="position:absolute;right:6px;top:6px;background:transparent" id="lgEye" type="button">👁️</button></div>
      <button class="btn acc block mt" id="lgPassBtn">🔑 Ingresar</button>
      <p class="small center mt"><a href="#" id="lgOlvide" style="color:var(--accent);font-weight:700">¿Olvidaste tu contraseña? Entra con un PIN al correo</a></p>`;
  c.innerHTML = `
    <div class="seg"><button class="on">Ingresar</button><button id="toReg">Registrarme ✨</button></div>
    <div class="row mt" style="gap:8px">
      <button class="chip ${L.metodo === 'pin' ? 'on' : ''}" id="mPin">📩 PIN por correo</button>
      <button class="chip ${L.metodo === 'password' ? 'on' : ''}" id="mPass">🔑 Usuario y contraseña</button>
    </div>
    <div class="step-anim">${body}</div>
    ${DEMO ? `<hr class="sep"><p class="tiny muted b" style="margin:0 0 8px">ACCESO RÁPIDO DEMO</p><div class="row wrap" style="gap:6px">
      <button class="chip" onclick="demoLogin('admin')">⚙️ Admin</button><button class="chip" onclick="demoLogin('cocina')">👩‍🍳 Cocina</button>
      <button class="chip" onclick="demoLogin('servicio')">🛎️ Servicio</button><button class="chip" onclick="demoLogin('usuario')">🙂 Colaborador</button>
      <button class="chip" onclick="Demo._reset()">↺ Reiniciar demo</button></div>` : ''}`;
  $('#toReg').onclick = () => { L.modo = 'registro'; drawAuthCard(); };
  $('#mPin').onclick = () => { L.metodo = 'pin'; L.paso = 'correo'; drawAuthCard(); };
  $('#mPass').onclick = () => { L.metodo = 'password'; drawAuthCard(); };
  if (L.metodo === 'pin' && L.paso === 'correo') {
    const go = async () => {
      const btn = $('#lgPinBtn'); L.correo = $('#lgCorreo').value.trim();
      if (!/^\S+@\S+\.\S+$/.test(L.correo)) return toast('Escribe un correo válido', 'err');
      btn.disabled = true; btn.textContent = 'Enviando…';
      try { await rpc('bistro_pin_solicitar', { p_correo: L.correo }); L.paso = 'pin'; drawAuthCard(); toast('Revisa tu correo 📬', 'ok'); }
      catch (e) { toast(errMsg(e), 'err', 4500); btn.disabled = false; btn.textContent = '📩 Enviarme un PIN'; }
    };
    $('#lgPinBtn').onclick = go; $('#lgCorreo').onkeydown = e => e.key === 'Enter' && go();
  }
  if (L.metodo === 'pin' && L.paso === 'pin') {
    const boxes = $$('#pinBoxes input'); boxes[0].focus();
    const val = () => boxes.map(b => b.value).join('');
    const ver = async () => {
      if (val().length < 6) return; const btn = $('#lgVerBtn'); btn.disabled = true;
      try { sesionIniciada(await rpc('bistro_pin_verificar', { p_correo: L.correo, p_pin: val() })); L.paso = 'correo'; }
      catch (e) { toast(errMsg(e), 'err'); boxes.forEach(b => b.value = ''); boxes[0].focus(); btn.disabled = false; }
    };
    boxes.forEach((b, i) => {
      b.oninput = () => { b.value = b.value.replace(/\D/g, '').slice(-1); if (b.value && i < 5) boxes[i + 1].focus(); if (val().length === 6) ver(); };
      b.onkeydown = e => { if (e.key === 'Backspace' && !b.value && i > 0) boxes[i - 1].focus(); };
      b.onpaste = e => { const t = (e.clipboardData.getData('text') || '').replace(/\D/g, '').slice(0, 6); if (t) { e.preventDefault(); t.split('').forEach((ch, j) => boxes[j] && (boxes[j].value = ch)); if (t.length === 6) ver(); } };
    });
    $('#lgVerBtn').onclick = ver;
    $('#lgOtro').onclick = e => { e.preventDefault(); L.paso = 'correo'; drawAuthCard(); };
    $('#lgReenv').onclick = async e => { e.preventDefault(); try { await rpc('bistro_pin_solicitar', { p_correo: L.correo }); toast('PIN reenviado 📬', 'ok'); } catch (er) { toast(errMsg(er), 'err'); } };
  }
  if (L.metodo === 'password') {
    const go = async () => {
      const btn = $('#lgPassBtn'); btn.disabled = true; L.usuario = $('#lgUsr').value.trim();
      try { sesionIniciada(await rpc('bistro_login_pass', { p_usuario: L.usuario, p_password: $('#lgPass').value })); }
      catch (e) { toast(errMsg(e), 'err', 4500); btn.disabled = false; }
    };
    $('#lgPassBtn').onclick = go; $('#lgPass').onkeydown = e => e.key === 'Enter' && go();
    $('#lgEye').onclick = () => { const p = $('#lgPass'); p.type = p.type === 'password' ? 'text' : 'password'; };
    $('#lgOlvide').onclick = e => { e.preventDefault(); L.metodo = 'pin'; L.paso = 'correo'; if (L.usuario.includes('@')) L.correo = L.usuario; drawAuthCard(); };
  }
}

/* =====================================================================
   REGISTRO (asistente de 4 pasos)
   ===================================================================== */
const R = { step: 1, nombre: '', apellidos: '', correo: '', foto: null, metodo: 'pin', usuario: '', password: '', password2: '', acepto: false };
function drawRegistro(c) {
  Cam.stop();
  const pasos = `<div class="steps">${[1, 2, 3, 4].map(i => `<i class="${i <= R.step ? 'on' : ''}"></i>`).join('')}</div>`;
  let h = '';
  if (R.step === 1) h = `
    <div class="reg-title">¡Hola! 👋</div><p class="muted" style="margin:0">Cuéntanos quién eres para preparar tu cuenta.</p>
    <div class="grid2"><div><label class="f">Nombre</label><input class="inp" id="rgNom" autocomplete="given-name" value="${esc(R.nombre)}"></div>
    <div><label class="f">Apellidos</label><input class="inp" id="rgApe" autocomplete="family-name" value="${esc(R.apellidos)}"></div></div>
    <label class="f">Correo</label><input class="inp" id="rgCor" type="email" inputmode="email" autocomplete="email" placeholder="nombre@empresa.com" value="${esc(R.correo)}">
    <p class="tiny muted">Un correo solo puede tener una cuenta.</p>`;
  if (R.step === 2) h = `
    <div class="reg-title">Tu mejor foto 📸</div>
    <div class="why"><span class="e">🤝</span><div>Con tu foto, el equipo del bistró <b>te reconoce al llegar</b> y te entrega tu pedido sin tener que preguntar tu nombre. Solo la ven cocina y servicio.</div></div>
    ${Cam.html(R.foto)}`;
  if (R.step === 3) h = `
    <div class="reg-title">¿Cómo quieres ingresar? 🔐</div><p class="muted" style="margin:0 0 12px">Por seguridad, tu sesión vence cada <b>${meses()}</b>. Elige cómo volver a entrar.</p>
    <div class="col">
      <div class="method ${R.metodo === 'pin' ? 'on' : ''}" onclick="R.metodo='pin';drawAuthCard()"><span class="tag">RECOMENDADO</span>
        <div class="mt-h"><span class="e">📩</span>PIN por correo</div>
        <ul><li>Escribes tu correo y te llega un código de 6 dígitos.</li><li>Sin contraseñas que recordar.</li>
        <li>Cada ${meses()} te pediremos un PIN nuevo.</li><li>Ideal si <b>recibes el correo en tu celular</b>.</li></ul></div>
      <div class="method ${R.metodo === 'password' ? 'on' : ''}" onclick="R.metodo='password';drawAuthCard()">
        <div class="mt-h"><span class="e">🔑</span>Usuario y contraseña</div>
        <ul><li>Pensado para quien <b>no recibe el correo en el celular</b>.</li><li>Cada ${meses()} la sesión vence y escribes tu contraseña otra vez.</li></ul>
        ${R.metodo === 'password' ? `<div class="risk">⚠️ <b>Ojo:</b> si la olvidas, tendrás que recibir un PIN en tu correo o pedirle a un administrador que la restablezca. Guárdala en un lugar seguro.</div>` : ''}
      </div>
    </div>
    ${R.metodo === 'password' ? `<div class="step-anim">
      <label class="f">Nombre de usuario</label><input class="inp" id="rgUsr" autocapitalize="off" autocomplete="username" value="${esc(R.usuario || R.correo.split('@')[0])}">
      <label class="f">Contraseña (mín. 8 caracteres)</label><input class="inp" id="rgP1" type="password" autocomplete="new-password" value="${esc(R.password)}">
      <div class="meter"><i id="rgMeter"></i></div><div class="tiny muted" id="rgMeterTxt"></div>
      <label class="f">Repite la contraseña</label><input class="inp" id="rgP2" type="password" autocomplete="new-password" value="${esc(R.password2)}">
      <label class="chk mt"><input type="checkbox" id="rgAcepto" ${R.acepto ? 'checked' : ''}><span>Entiendo que debo recordar mi contraseña y que la sesión vence cada ${meses()}.</span></label></div>` : ''}`;
  if (R.step === 4) h = `
    <div class="reg-title">¿Todo bien? ✅</div>
    <div class="row mt" style="gap:16px"><img class="av" src="${R.foto}" style="width:92px;height:92px;border:4px solid var(--accent-soft)">
    <div><div class="b" style="font-size:18px">${esc(R.nombre)} ${esc(R.apellidos)}</div><div class="muted small">${esc(R.correo)}</div>
    <div class="chip mt" style="margin-top:8px">${R.metodo === 'pin' ? '📩 PIN por correo' : '🔑 Usuario: ' + esc(R.usuario)}</div></div></div>
    <div class="why mt"><span class="e">⏳</span><div>Tu solicitud llegará a los administradores. Cuando la aprueben te avisaremos por correo y podrás hacer tu primer pedido.</div></div>`;
  if (R.step === 5) h = `<div class="success"><div class="big">✓</div><div class="reg-title">¡Solicitud enviada!</div>
    <p class="muted">Gracias, ${esc(R.nombre)}. Un administrador revisará tu solicitud y te llegará un correo a <b>${esc(R.correo)}</b> cuando esté lista.</p>
    <button class="btn acc block mt" onclick="L.modo='ingresar';Object.assign(R,{step:1,foto:null,password:'',password2:''});drawAuthCard()">Volver al inicio</button></div>`;

  c.innerHTML = R.step === 5 ? h : `
    <div class="seg"><button id="toLog">Ingresar</button><button class="on">Registrarme ✨</button></div>
    <div style="margin-top:16px">${pasos}</div><div class="step-anim">${h}</div>
    <div class="row mt2">${R.step > 1 ? '<button class="btn ghost" id="rgBack">←</button>' : ''}
      <button class="btn acc grow" id="rgNext">${R.step === 4 ? 'Enviar solicitud 🚀' : 'Continuar →'}</button></div>`;
  if (R.step === 5) return;
  $('#toLog').onclick = () => { L.modo = 'ingresar'; drawAuthCard(); };
  if ($('#rgBack')) $('#rgBack').onclick = () => { guardarPaso(); R.step--; drawAuthCard(); };
  if (R.step === 2) Cam.bind(f => { R.foto = f; drawAuthCard(); });
  if (R.step === 3 && R.metodo === 'password') {
    const upd = () => { const p = $('#rgP1').value; let s = 0; if (p.length >= 8) s++; if (/[A-Z]/.test(p) && /[a-z]/.test(p)) s++; if (/\d/.test(p)) s++; if (/[^A-Za-z0-9]/.test(p) || p.length >= 12) s++;
      const col = ['#ddd', '#C98585', '#D9B36E', '#8DB89E', '#4F8A6B'][s]; $('#rgMeter').style.cssText = `width:${s * 25}%;background:${col}`;
      $('#rgMeterTxt').textContent = p ? ['Muy débil', 'Débil', 'Regular', 'Buena', '¡Excelente!'][s] : ''; };
    $('#rgP1').oninput = upd; upd();
  }
  $('#rgNext').onclick = async () => {
    guardarPaso();
    if (R.step === 1) {
      if (!R.nombre || !R.apellidos) return toast('Completa nombre y apellidos', 'err');
      if (!/^\S+@\S+\.\S+$/.test(R.correo)) return toast('Revisa el correo', 'err');
    }
    if (R.step === 2 && !R.foto) return toast('Necesitamos tu foto para reconocerte 😊', 'err');
    if (R.step === 3 && R.metodo === 'password') {
      if (!R.usuario) return toast('Elige un nombre de usuario', 'err');
      if (R.password.length < 8) return toast(ERR.PASSWORD_CORTA, 'err');
      if (R.password !== R.password2) return toast('Las contraseñas no coinciden', 'err');
      if (!R.acepto) return toast('Confirma que entiendes el riesgo de olvidarla', 'err');
    }
    if (R.step === 4) {
      const b = $('#rgNext'); b.disabled = true; b.textContent = 'Enviando…';
      try {
        const r = await rpc('bistro_registrar', { p: { nombre: R.nombre, apellidos: R.apellidos, correo: R.correo, foto: R.foto, metodo: R.metodo, usuario: R.usuario, password: R.password } });
        if (r.estado === 'activo') { toast('Eres el administrador inicial. ¡Ya puedes ingresar!', 'ok', 5000); L.modo = 'ingresar'; L.metodo = R.metodo; L.correo = R.correo; L.usuario = R.usuario; R.step = 1; drawAuthCard(); return; }
        R.step = 5; confetti(); drawAuthCard(); return;
      } catch (e) { toast(errMsg(e), 'err', 5000); b.disabled = false; b.textContent = 'Enviar solicitud 🚀'; return; }
    }
    R.step++; drawAuthCard();
  };
}
function guardarPaso() {
  const v = id => $('#' + id)?.value.trim();
  if (R.step === 1) { R.nombre = v('rgNom') ?? R.nombre; R.apellidos = v('rgApe') ?? R.apellidos; R.correo = (v('rgCor') ?? R.correo).toLowerCase(); }
  if (R.step === 3 && R.metodo === 'password') { R.usuario = (v('rgUsr') || '').toLowerCase(); R.password = $('#rgP1').value; R.password2 = $('#rgP2').value; R.acepto = $('#rgAcepto').checked; }
}

/* ---------- componente de cámara / foto ---------- */
const Cam = {
  stream: null, onSet: null,
  html(foto) {
    return `<div class="cam-wrap">
      <div class="cam-ring ${foto ? 'done' : ''}" id="camRing"><div class="cam-circle">
        ${foto ? `<img src="${foto}">` : `<video id="camVideo" playsinline autoplay muted class="hide"></video>
          <div class="cam-ph" id="camPh"><span class="e">😊</span><span>¡Sonríe!</span></div>`}
        <div class="cam-count" id="camCount"></div><div class="cam-flash" id="camFlash"></div></div>
        ${foto ? '<div class="cam-ok">✓</div>' : ''}</div>
      ${foto ? `<div class="b" style="font-size:17px">¡Te ves genial! ✨</div>
        <div class="row"><button class="btn ghost sm" id="camRetry">🔄 Tomar otra</button></div>` : `
        <div class="row wrap" style="justify-content:center">
          <button class="btn acc" id="camStart">📷 Usar cámara</button>
          <button class="btn acc hide" id="camSnap">📸 ¡Tomar foto!</button>
          <label class="btn ghost" style="cursor:pointer">🖼️ Subir foto<input type="file" accept="image/*" id="camFile" class="hide"></label></div>
        <div class="row wrap" style="justify-content:center;gap:6px"><span class="chip">🙂 De frente</span><span class="chip">💡 Buena luz</span><span class="chip">🕶️ Sin lentes oscuros</span></div>`}
    </div>`;
  },
  bind(onSet) {
    this.onSet = onSet;
    $('#camStart') && ($('#camStart').onclick = () => this.start());
    $('#camSnap') && ($('#camSnap').onclick = () => this.snap());
    $('#camFile') && ($('#camFile').onchange = async e => { const f = e.target.files[0]; if (!f) return; this.stop(); this.onSet(await comprimir(await fileToDataURL(f))); });
    $('#camRetry') && ($('#camRetry').onclick = () => { this.onSet(null); });
  },
  async start() {
    try {
      this.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 720 }, height: { ideal: 720 } }, audio: false });
      const v = $('#camVideo'); v.srcObject = this.stream; v.classList.remove('hide'); $('#camPh').classList.add('hide');
      $('#camStart').classList.add('hide'); $('#camSnap').classList.remove('hide');
    } catch (e) { toast('No pudimos abrir la cámara. Usa “Subir foto”.', 'err', 4500); }
  },
  async snap() {
    const v = $('#camVideo'), cnt = $('#camCount'); $('#camSnap').disabled = true;
    for (const n of [3, 2, 1]) { cnt.textContent = n; await sleep(650); }
    cnt.textContent = ''; $('#camFlash').classList.add('go');
    const foto = await comprimir(v); this.stop(); await sleep(250); this.onSet(foto);
  },
  stop() { if (this.stream) { this.stream.getTracks().forEach(t => t.stop()); this.stream = null; } }
};
</script>
<script>
/* =====================================================================
   SHELL / NAVEGACIÓN
   ===================================================================== */
const VIEWS = {
  pedir:     { label: 'Pedir',     icon: '🍽️', roles: null,         render: el => viewPedir(el) },
  historial: { label: 'Historial', icon: '🧾', roles: null,         render: el => viewHistorial(el) },
  cocina:    { label: 'Cocina',    icon: '👩‍🍳', roles: ['cocina'],   render: el => viewCocina(el) },
  servicio:  { label: 'Servicio',  icon: '🛎️', roles: ['servicio'], render: el => viewServicio(el) },
  menu:      { label: 'Menú',      icon: '📋', roles: ['cocina'],   render: el => viewMenu(el) },
  admin:     { label: 'Admin',     icon: '⚙️', roles: ['admin'],    render: el => viewAdmin(el) },
  perfil:    { label: 'Perfil',    icon: '👤', roles: null,         render: el => viewPerfil(el) }
};
function route() {
  let v = (location.hash || '').replace('#', '').split('/')[0];
  if (!VIEWS[v] || !can(VIEWS[v].roles)) v = 'pedir';
  clearTimers(); closeAllModals(); document.body.classList.remove('kds');
  if (v !== 'cocina' && v !== 'servicio') document.body.classList.remove('kiosk');
  S.view = v; renderShell(); VIEWS[v].render($('#main'));
}
function go(v) { if (location.hash === '#' + v) route(); else location.hash = v; }
function renderShell() {
  const u = S.user, navs = Object.entries(VIEWS).filter(([k, v]) => can(v.roles));
  const link = ([k, v]) => `<a href="#${k}" class="${S.view === k ? 'on' : ''}"><span class="i">${v.icon}</span><span>${v.label}</span></a>`;
  const bottom = navs.filter(([k]) => k !== 'perfil').slice(0, 5);
  $('#app').innerHTML = `${DEMO ? '<div class="demo-bar"><b>MODO DEMO</b> · los correos se muestran como avisos en pantalla</div>' : ''}
  <div class="shell">
    <aside class="rail">
      <div class="brand" style="flex-direction:column;align-items:flex-start;gap:0">${logoHTML()}<div class="sb2">${esc(S.cfg.subtitulo)}</div></div>
      ${navs.map(link).join('')}
      <div class="me" onclick="go('perfil')">${fotoImg(u.id, u.nombre, u.apellidos, 'av', 40)}
        <div class="grow"><div class="b small">${esc(u.nombre)} ${esc(u.apellidos)}</div><div class="tiny muted">${u.roles.length ? u.roles.join(' · ') : 'colaborador'}</div></div></div>
    </aside>
    <div class="main-col">
      <header class="topbar"><div class="brand grow">${logoHTML()}</div>
        <a href="#perfil">${fotoImg(u.id, u.nombre, u.apellidos, 'av', 38)}</a></header>
      <main id="main"></main>
    </div>
    <nav class="bottomnav">${bottom.map(link).join('')}${navs.length > 5 ? '' : ''}</nav>
  </div>`;
}
const skeleton = (n = 3) => Array(n).fill('<div class="skel"></div>').join('');

/* =====================================================================
   PEDIR (vista del colaborador)
   ===================================================================== */
const ESTADOS = {
  pendiente: { t: 'Recibido', e: '🕐', msg: 'Recibido. Puedes editarlo hasta la hora de corte.' },
  preparando: { t: 'En preparación', e: '👩‍🍳', msg: 'La cocina ya está preparando tu pedido.' },
  listo: { t: '¡Listo!', e: '🔔', msg: '¡Tu pedido está listo! Pasa a recogerlo.' },
  sirviendo: { t: 'Sirviendo', e: '🛎️', msg: 'Te están sirviendo en este momento.' },
  entregado: { t: 'Entregado', e: '✅', msg: 'Entregado. ¡Buen provecho!' }
};
const badge = e => `<span class="badge st-${e}">${ESTADOS[e]?.e || ''} ${ESTADOS[e]?.t || e}</span>`;

function diasServicio() {
  const ds = S.cfg.dias_servicio || [1, 2, 3, 4, 5], hoyD = pd(hoy()), ws = weekStart(hoyD), out = [];
  const fin = addDays(ws, 7 * (1 + (S.cfg.semanas_adelante ?? 1)) - 1);
  for (let d = new Date(hoyD); d <= fin; d = addDays(d, 1)) if (ds.includes(isoDow(d))) out.push(ymd(d));
  return out;
}
function corteDe(t, fecha) {
  if (!t.hora_corte) return null; const d = pd(fecha); d.setDate(d.getDate() - (t.dias_antes || 0));
  const [h, m] = t.hora_corte.split(':').map(Number); d.setHours(h, m, 0, 0); return d;
}
function platosDelDia(fecha, tiempoId) {
  const M = S.menu, disp = new Map(M.disp.filter(d => d.fecha === fecha).map(d => [d.plato_id, d]));
  const cats = M.categorias.filter(c => c.tiempo_id === tiempoId && c.activo !== false);
  return cats.map(c => ({ cat: c, platos: M.platos.filter(p => p.categoria_id === c.id && p.activo !== false && disp.has(p.id)).map(p => ({ ...p, precio: disp.get(p.id).precio ?? p.precio, agotado: disp.get(p.id).agotado })) }))
    .filter(x => x.platos.length);
}
async function viewPedir(el) {
  el.innerHTML = skeleton();
  const dias = diasServicio();
  if (!dias.length) { el.innerHTML = '<div class="empty"><div class="e">🗓️</div>No hay días de servicio configurados.</div>'; return; }
  if (!S.dia || !dias.includes(S.dia)) S.dia = dias[0];
  try {
    const [menu, peds] = await Promise.all([
      rpc('bistro_menu', { p_desde: dias[0], p_hasta: dias.at(-1) }),
      rpc('bistro_mis_pedidos', { p_desde: dias[0], p_hasta: dias.at(-1) })]);
    S.menu = menu; S.misPedidos = peds; S._listosAvisados = new Set(peds.filter(p => p.estado === 'listo').map(p => p.id));
  } catch (e) { el.innerHTML = `<div class="empty"><div class="e">😕</div>${esc(errMsg(e))}</div>`; return; }
  drawPedir();
  S.timers.push(setInterval(refrescarMisPedidos, CONFIG.POLL_USUARIO_MS));
  S.timers.push(setInterval(() => S.view === 'pedir' && $('#mealsBox') && drawMeals(), 60000));
}
async function refrescarMisPedidos() {
  const dias = diasServicio(); if (!dias.length) return;
  try {
    const peds = await rpc('bistro_mis_pedidos', { p_desde: dias[0], p_hasta: dias.at(-1) });
    const nuevosListos = peds.filter(p => p.estado === 'listo' && !S._listosAvisados.has(p.id));
    const cambio = JSON.stringify(peds.map(p => [p.id, p.estado, p.total])) !== JSON.stringify(S.misPedidos.map(p => [p.id, p.estado, p.total]));
    S.misPedidos = peds;
    nuevosListos.forEach(p => { S._listosAvisados.add(p.id); avisarListo(p); });
    if (cambio && S.view === 'pedir' && !$('#modals').children.length) drawPedir();
  } catch (e) { }
}
// PREVISTO: aviso al usuario cuando la cocina marca su pedido como listo
function avisarListo(p) {
  toast(`🔔 ¡Tu ${p.tiempo.toLowerCase()} está listo! Pasa a recogerlo.`, 'ok', 8000); beep(3);
  try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (e) { }
  try { if ('Notification' in window && Notification.permission === 'granted') new Notification('¡Tu pedido está listo! 🍽️', { body: `Pedido #${p.numero} · ${p.tiempo}`, icon: S.cfg.logo || undefined }); } catch (e) { }
}
function drawPedir() {
  const el = $('#main'), u = S.user, dias = diasServicio(), h = new Date().getHours();
  const saludo = h < 12 ? 'Buenos días' : h < 18 ? 'Buenas tardes' : 'Buenas noches';
  const listos = S.misPedidos.filter(p => p.estado === 'listo' && p.fecha === hoy());
  const wsHoy = ymd(weekStart(new Date()));
  let strip = '', lastWk = null;
  dias.forEach(d => {
    const wk = ymd(weekStart(pd(d)));
    if (wk !== lastWk) { strip += `<div class="wk-lbl">${wk === wsHoy ? 'Esta semana' : 'Próxima'}</div>`; lastWk = wk; }
    const n = S.misPedidos.filter(p => p.fecha === d).length, dt = pd(d);
    strip += `<button class="day ${d === S.dia ? 'on' : ''} ${d === hoy() ? 'today' : ''}" onclick="S.dia='${d}';drawPedir()">
      <div class="dn">${DN[dt.getDay()]}</div><div class="dd">${dt.getDate()}</div><div class="dots">${'<i></i>'.repeat(n)}</div></button>`;
  });
  el.innerHTML = `
    <div class="hello"><div class="grow"><div class="muted small b">${saludo},</div><h1>${esc(u.nombre)} 👋</h1></div>
      <button class="btn soft sm" onclick="go('historial')">🧾 Historial</button></div>
    ${listos.map(p => `<div class="ready-banner"><span class="e">🔔</span><div class="grow"><div class="b" style="font-size:17px">¡Tu ${esc(p.tiempo.toLowerCase())} está listo!</div><div class="small" style="opacity:.9">Pedido #${p.numero} · pasa al área de servicio</div></div></div>`).join('')}
    <p class="muted small" style="margin:8px 0 2px">Elige el día y arma tu pedido. Puedes pedir para toda la semana. 🗓️</p>
    <div class="daystrip">${strip}</div>
    <div class="row sp"><h2 class="display" style="font-size:22px">${cap(fLarga(S.dia))}</h2>
      ${S.misPedidos.some(p => p.fecha === S.dia) ? `<span class="small muted">Total del día: <b>${money(S.misPedidos.filter(p => p.fecha === S.dia).reduce((a, p) => a + Number(p.total), 0))}</b></span>` : ''}</div>
    <div id="mealsBox" class="grid-meals mt"></div>`;
  drawMeals();
  const on = $('.day.on'); on && on.scrollIntoView({ inline: 'center', block: 'nearest' });
}
function drawMeals() {
  const box = $('#mealsBox'); if (!box) return;
  const tiempos = S.menu.tiempos.filter(t => t.activo !== false);
  if (!tiempos.length) { box.innerHTML = '<div class="empty"><div class="e">🍽️</div>La cocina aún no ha configurado el menú.</div>'; return; }
  box.innerHTML = tiempos.map(t => {
    const grupos = platosDelDia(S.dia, t.id), ped = S.misPedidos.find(p => p.fecha === S.dia && p.tiempo_id === t.id);
    const corte = corteDe(t, S.dia), abierto = !corte || new Date() < corte;
    const falta = corte && abierto ? corte - new Date() : 0;
    const corteTxt = !corte ? 'Sin hora de corte' : abierto ? (falta < 6 * 3600e3 ? `⏳ Cierra en ${dur(falta)}` : `Pide antes de ${hora12(t.hora_corte)}${t.dias_antes ? ` (${t.dias_antes} día${t.dias_antes > 1 ? 's' : ''} antes)` : ''}`) : `Corte: ${hora12(t.hora_corte)}`;
    let body = '';
    if (ped) {
      const it = ped.items, edit = ped.estado === 'pendiente' && abierto;
      const tono = { pendiente: 'var(--warn-soft)', preparando: 'var(--info-soft)', listo: 'var(--ok-soft)', sirviendo: '#F3E8FD', entregado: '#eee' }[ped.estado];
      body = `<ul class="olist">${it.map(i => `<li><span class="q">${i.cantidad}×</span><span class="grow">${esc(i.nombre)}${i.nota ? `<div class="tiny muted">${esc(i.nota)}</div>` : ''}</span><span class="small muted">${money(i.precio * i.cantidad)}</span></li>`).join('')}</ul>
        ${ped.peticion ? `<div class="note">📝 ${esc(ped.peticion)}</div>` : ''}
        <div class="row sp mt"><span class="small muted">Pedido #${ped.numero}</span><b style="font-size:18px">${money(ped.total)}</b></div>
        ${edit ? `<div class="row mt"><button class="btn ghost sm" onclick="eliminarPedido('${ped.tiempo_id}')">🗑️ Quitar</button><button class="btn acc grow" onclick="abrirEditor('${t.id}')">✏️ Editar pedido</button></div>`
          : `<div class="lockmsg" style="background:${tono}">${ped.estado === 'pendiente' ? '⏰ Ya pasó la hora de corte; tu pedido quedó registrado.' : ESTADOS[ped.estado].msg}</div>`}`;
    } else if (!grupos.length) body = `<div class="muted small" style="padding:4px 0 6px">La cocina aún no publica el menú de este día. 👩‍🍳</div>`;
    else if (!abierto) body = `<div class="lockmsg" style="background:var(--soft)">⏰ Ya pasó la hora de corte (${hora12(t.hora_corte)}).</div>`;
    else body = `<div class="peek">${grupos.flatMap(g => g.platos.filter(p => p.tipo === 'principal')).slice(0, 6).map(p => `<span class="chip">${esc(p.nombre)}</span>`).join('')}</div>
        <button class="btn acc block" onclick="abrirEditor('${t.id}')">＋ Armar mi pedido</button>`;
    return `<div class="meal"><div class="meal-h"><span class="e">${t.emoji || '🍽️'}</span><div class="grow"><h3>${esc(t.nombre)}</h3><div class="tiny muted b">${corteTxt}</div></div>${ped ? badge(ped.estado) : ''}</div>
      <div class="meal-b">${body}</div></div>`;
  }).join('');
}
async function eliminarPedido(tiempoId) {
  if (!await confirmar('¿Quitar pedido?', 'Se eliminará tu pedido de este tiempo de comida.', 'Quitar', 'danger')) return;
  try { await rpc('bistro_guardar_pedido', { p: { fecha: S.dia, tiempo_id: tiempoId, items: [] } }); toast('Pedido eliminado'); await refrescarMisPedidos(); drawPedir(); }
  catch (e) { toast(errMsg(e), 'err'); }
}

/* ---------- editor de pedido ---------- */
let E = null;
function abrirEditor(tiempoId) {
  const t = S.menu.tiempos.find(x => x.id === tiempoId), ped = S.misPedidos.find(p => p.fecha === S.dia && p.tiempo_id === tiempoId);
  E = { t, fecha: S.dia, qty: {}, notas: {}, peticion: ped?.peticion || '', repetir: new Set() };
  (ped?.items || []).forEach(i => { if (i.plato_id) { E.qty[i.plato_id] = (E.qty[i.plato_id] || 0) + i.cantidad; if (i.nota) E.notas[i.plato_id] = i.nota; } });
  const ov = openModal(`<div class="sheet-h"><span style="font-size:28px">${t.emoji || '🍽️'}</span><div class="grow"><h2>${esc(t.nombre)}</h2><div class="small muted">${cap(fLarga(S.dia))}</div></div>
      <button class="icon-btn" onclick="closeModal()">✕</button></div>
    <div class="sheet-b" id="edBody"></div>
    <div class="sheet-f"><div class="total-pill grow">Total<b id="edTotal">₡0</b></div><button class="btn acc" id="edSave" style="min-width:170px">Guardar pedido</button></div>`, { wide: true });
  drawEditor(); $('#edSave', ov).onclick = guardarEditor;
}
function drawEditor() {
  const grupos = platosDelDia(E.fecha, E.t.id), b = $('#edBody'); if (!b) return;
  const SUG = ['Sin cebolla', 'Salsa aparte', 'Poca sal', 'Para llevar 🥡', 'Sin picante', 'Extra ensalada'];
  const otrosDias = diasServicio().filter(d => d !== E.fecha && (!corteDe(E.t, d) || new Date() < corteDe(E.t, d)) &&
    !S.misPedidos.some(p => p.fecha === d && p.tiempo_id === E.t.id && p.estado !== 'pendiente') && platosDelDia(d, E.t.id).length);
  b.innerHTML = grupos.map(g => {
    const pr = g.platos.filter(p => p.tipo === 'principal'), sd = g.platos.filter(p => p.tipo !== 'principal');
    return `<div class="cat-h">${g.cat.emoji || '🍴'} ${esc(g.cat.nombre)}</div>
      ${pr.map(p => { const q = E.qty[p.id] || 0; return `<div class="dish ${q ? 'sel' : ''} ${p.agotado ? 'off' : ''}">
        <div class="grow"><div class="nm">${esc(p.nombre)}${p.agotado ? ' · <span style="color:var(--danger)">Agotado</span>' : ''}</div>${p.descripcion ? `<div class="ds">${esc(p.descripcion)}</div>` : ''}
        ${q ? `<a href="#" class="tiny" style="color:var(--accent);font-weight:700" onclick="event.preventDefault();notaPlato('${p.id}')">${E.notas[p.id] ? '📝 ' + esc(E.notas[p.id]) : '＋ nota para este plato'}</a>` : ''}</div>
        <div class="pr">${money(p.precio)}</div>
        ${p.agotado ? '' : `<div class="step">${q ? `<button onclick="cant('${p.id}',-1)">−</button><span>${q}</span>` : ''}<button class="add" onclick="cant('${p.id}',1)">+</button></div>`}</div>`; }).join('')}
      ${sd.length ? `<div class="tiny muted b" style="margin:10px 0 6px">${pr.length ? 'ACOMPAÑAMIENTOS Y ADICIONALES' : ''}</div><div class="sides">${sd.map(p => { const q = E.qty[p.id] || 0; return `
        <div class="side ${q ? 'sel' : ''} ${p.agotado ? 'off' : ''}" onclick="cant('${p.id}',1)" oncontextmenu="event.preventDefault();cant('${p.id}',-1)">
          ${q ? `<span class="qq" onclick="event.stopPropagation();cant('${p.id}',-1)">${q > 1 ? q + '×' : '✓'}</span>` : '＋'} ${esc(p.nombre)} <span class="px">${Number(p.precio) ? money(p.precio) : ''}</span></div>`; }).join('')}</div>
        <div class="tiny muted" style="margin-top:6px">Toca para agregar · toca el ✓ para quitar</div>` : ''}`;
  }).join('') + `
    <div class="cat-h mt2">💬 Peticiones especiales</div>
    <textarea class="inp" id="edPet" maxlength="300" placeholder="Ej.: sin cebolla, la salsa aparte, lo recojo a las 12:30…">${esc(E.peticion)}</textarea>
    <div class="sug">${SUG.map(s => `<button class="chip" onclick="sugerir('${s}')">${s}</button>`).join('')}</div>
    ${otrosDias.length ? `<div class="cat-h mt2">🔁 Repetir este pedido en</div><div class="row wrap" style="gap:6px">${otrosDias.map(d => `<button class="chip ${E.repetir.has(d) ? 'on' : ''}" onclick="E.repetir.has('${d}')?E.repetir.delete('${d}'):E.repetir.add('${d}');drawEditor()">${fCorta(d)}</button>`).join('')}</div>
      <div class="tiny muted mt">Solo se copian los platos que también estén disponibles ese día.</div>` : ''}`;
  const tot = grupos.flatMap(g => g.platos).reduce((a, p) => a + (E.qty[p.id] || 0) * Number(p.precio), 0);
  $('#edTotal').textContent = money(tot);
  $('#edPet').oninput = e => E.peticion = e.target.value;
}
function cant(id, d) { E.qty[id] = Math.max(0, (E.qty[id] || 0) + d); if (!E.qty[id]) { delete E.qty[id]; delete E.notas[id]; } const sc = $('#edBody').scrollTop; drawEditor(); $('#edBody').scrollTop = sc; }
async function notaPlato(id) { const v = await pedirTexto('Nota para este plato', 'Ej.: término medio, sin salsa…', E.notas[id] || ''); if (v !== null) { E.notas[id] = v.trim(); drawEditor(); } }
function sugerir(s) { E.peticion = (E.peticion ? E.peticion.replace(/\s*$/, '') + ', ' : '') + s.replace(/ 🥡/, ''); const sc = $('#edBody').scrollTop; drawEditor(); $('#edBody').scrollTop = sc; }
async function guardarEditor() {
  const items = Object.entries(E.qty).map(([plato_id, cantidad]) => ({ plato_id, cantidad, nota: E.notas[plato_id] || null }));
  if (!items.length) return toast('Agrega al menos un plato 🙂', 'err');
  const btn = $('#edSave'); btn.disabled = true; btn.textContent = 'Guardando…';
  try {
    await rpc('bistro_guardar_pedido', { p: { fecha: E.fecha, tiempo_id: E.t.id, items, peticion: E.peticion } });
    let rep = 0, omit = [];
    for (const d of E.repetir) {
      const disp = new Set(platosDelDia(d, E.t.id).flatMap(g => g.platos.filter(p => !p.agotado).map(p => p.id)));
      const its = items.filter(i => disp.has(i.plato_id));
      if (!its.length) { omit.push(fCorta(d)); continue; }
      try { await rpc('bistro_guardar_pedido', { p: { fecha: d, tiempo_id: E.t.id, items: its, peticion: E.peticion } }); rep++; } catch (e) { omit.push(fCorta(d)); }
    }
    closeModal(); toast(rep ? `¡Listo! Pedido guardado para ${rep + 1} días 🎉` : '¡Pedido guardado! 🎉', 'ok');
    if (omit.length) toast('No se pudo repetir en: ' + omit.join(', '), 'info', 5000);
    await refrescarMisPedidos(); drawPedir();
  } catch (e) { toast(errMsg(e), 'err', 4500); btn.disabled = false; btn.textContent = 'Guardar pedido'; }
}

/* =====================================================================
   HISTORIAL DE CONSUMO
   ===================================================================== */
const H = { meses: 3 };
async function viewHistorial(el) {
  el.innerHTML = skeleton();
  const hasta = hoy(), desde = ymd(new Date(new Date().getFullYear(), new Date().getMonth() - (H.meses - 1), 1));
  let peds;
  try { peds = await rpc('bistro_mis_pedidos', { p_desde: desde, p_hasta: hasta }); } catch (e) { el.innerHTML = `<div class="empty">${esc(errMsg(e))}</div>`; return; }
  peds = peds.filter(p => p.fecha < hoy() || p.estado === 'entregado');
  const mesAct = hoy().slice(0, 7), delMes = peds.filter(p => p.fecha.startsWith(mesAct));
  const fav = {}; peds.forEach(p => p.items.filter(i => i.tipo === 'principal').forEach(i => fav[i.nombre] = (fav[i.nombre] || 0) + i.cantidad));
  const top = Object.entries(fav).sort((a, b) => b[1] - a[1])[0];
  const porMes = {}; peds.forEach(p => (porMes[p.fecha.slice(0, 7)] ||= []).push(p));
  el.innerHTML = `<h1 class="display" style="font-size:28px">Mi consumo 🧾</h1>
    <p class="muted small">Los días que ya pasaron salen de tu semana y quedan aquí.</p>
    <div class="stats mt"><div class="stat"><div class="v">${money(delMes.reduce((a, p) => a + Number(p.total), 0))}</div><div class="l">Este mes</div></div>
      <div class="stat"><div class="v">${delMes.length}</div><div class="l">Pedidos del mes</div></div>
      <div class="stat"><div class="v" style="font-size:16px;line-height:1.3">${top ? esc(top[0]) : '—'}</div><div class="l">Tu favorito ❤️</div></div></div>
    ${Object.keys(porMes).length ? Object.entries(porMes).map(([m, ps]) => { const [y, mm] = m.split('-').map(Number); return `
      <div class="sec-title"><h3 style="text-transform:capitalize">${MNL[mm - 1]} ${y}</h3><span class="b">${money(ps.reduce((a, p) => a + Number(p.total), 0))}</span></div>
      ${ps.map(p => { const d = pd(p.fecha); return `<div class="hrow" onclick="this.querySelector('.det').classList.toggle('hide')">
        <div class="dt"><b>${d.getDate()}</b><span>${DN[d.getDay()]}</span></div>
        <div class="grow"><div class="b">${p.tiempo_emoji || ''} ${esc(p.tiempo)}</div><div class="small muted">${p.items.map(i => `${i.cantidad}× ${esc(i.nombre)}`).join(' · ')}</div>
          <div class="det hide small mt">${p.peticion ? `📝 ${esc(p.peticion)}<br>` : ''}Pedido #${p.numero} · ${badge(p.estado)}${p.editado_servicio ? ' · <span class="tiny muted">ajustado en servicio</span>' : ''}</div></div>
        <b>${money(p.total)}</b></div>`; }).join('')}`; }).join('')
      : '<div class="empty"><div class="e">🍽️</div>Aún no tienes consumos registrados.</div>'}
    <div class="center mt2"><button class="btn ghost" onclick="H.meses+=3;viewHistorial($('#main'))">Ver meses anteriores</button></div>`;
}

// Selector de foto reutilizable: tomar con la cámara o subir desde galería/archivo
function elegirFoto(titulo, onOk) {
  let foto = null;
  const ov = openModal(`<div class="sheet-h"><h2>${titulo}</h2><button class="icon-btn" onclick="closeModal()">✕</button></div><div class="sheet-b" id="pfCam"></div>
