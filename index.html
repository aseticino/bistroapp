  const draw = () => { $('#pfCam', ov).innerHTML = Cam.html(foto); Cam.bind(f => { foto = f; draw(); }); $('#pfSave', ov).disabled = !foto; };
  draw();
  $('#pfSave', ov).onclick = async () => { const f = foto; ov._onClose = null; Cam.stop(); closeModal(ov); await onOk(f); };
}
function cambiarFoto() {
  elegirFoto('Nueva foto', async f => {
    try { S.user = await rpc('bistro_perfil_guardar', { p: { foto: f } }); S.fotos[S.user.id] = { v: S.user.foto_v, src: f }; toast('Foto actualizada ✨', 'ok'); route(); }
    catch (e) { toast(errMsg(e), 'err'); }
  });
}
async function cambiarMetodo(m) {
  if (m === S.user.metodo) return;
  if (m === 'password' && !S.user.tiene_password) return formPassword();
  try { S.user = await rpc('bistro_perfil_guardar', { p: { metodo: m } }); toast('Método de acceso actualizado', 'ok'); viewPerfil($('#main')); } catch (e) { toast(errMsg(e), 'err'); }
}
function formPassword(forzado = false) {
  const u = S.user;
  const ov = openModal(`<div class="sheet-h"><h2>${forzado ? 'Crea tu nueva contraseña' : u.tiene_password ? 'Cambiar contraseña' : 'Crear contraseña'}</h2>${forzado ? '' : '<button class="icon-btn" onclick="closeModal()">✕</button>'}</div>
    <div class="sheet-b">${forzado ? '<div class="why"><span class="e">🔑</span><div>Un administrador restableció tu contraseña. Crea una nueva para continuar.</div></div>' : ''}
      <label class="f">Usuario</label><input class="inp" id="fpU" autocapitalize="off" value="${esc(u.usuario || u.correo.split('@')[0])}">
      ${u.tiene_password && !u.debe_cambiar ? '<label class="f">Contraseña actual</label><input class="inp" id="fpA" type="password" autocomplete="current-password">' : ''}
      <label class="f">Nueva contraseña (mín. 8)</label><input class="inp" id="fpN" type="password" autocomplete="new-password">
      <label class="f">Repítela</label><input class="inp" id="fpN2" type="password" autocomplete="new-password">
      <div class="risk">⚠️ Si la olvidas, podrás entrar con un PIN a tu correo o pedir a un administrador que la restablezca.</div></div>
    <div class="sheet-f"><button class="btn acc block" id="fpOk">Guardar</button></div>`, { locked: forzado });
  $('#fpOk', ov).onclick = async () => {
    const n = $('#fpN').value; if (n.length < 8) return toast(ERR.PASSWORD_CORTA, 'err'); if (n !== $('#fpN2').value) return toast('No coinciden', 'err');
    try { S.user = await rpc('bistro_perfil_guardar', { p: { usuario: $('#fpU').value, password_actual: $('#fpA')?.value || '', password_nueva: n } }); ov._onClose = null; closeModal(ov); toast('Contraseña guardada 🔐', 'ok'); if (S.view === 'perfil') viewPerfil($('#main')); }
    catch (e) { toast(errMsg(e), 'err'); }
  };
}
function forzarCambioPassword() { formPassword(true); }
</script>
<script>
/* =====================================================================
   COCINA · pantalla de pedidos (tipo comida rápida)
   ===================================================================== */
const K = { fecha: null, tiempo: 'all', sonido: true, resumen: false, data: [], sig: '', known: null };
async function viewCocina(el) {
  document.body.classList.add('kds');
  K.fecha = K.fecha && K.fecha >= hoy() ? K.fecha : hoy(); K.known = null; K.sig = '';
  if (!S.menu?.tiempos) { try { S.menu = await rpc('bistro_menu', { p_desde: hoy(), p_hasta: hoy() }); } catch (e) { } }
  el.innerHTML = `<div class="kds-top">
      <h1>👩‍🍳 Cocina</h1>
      <input type="date" class="kbtn" id="kFecha" value="${K.fecha}" min="${hoy()}">
      <div class="row wrap" style="gap:6px" id="kTiempos"></div>
      <button class="kbtn" id="kRes">📊 Producción</button>
      <button class="kbtn" id="kAgot">🚫 Agotados</button>
      <button class="kbtn" id="kSnd">${K.sonido ? '🔔' : '🔕'}</button>
      <button class="kbtn" id="kFull">⛶ Pantalla completa</button>
      <div class="clock" id="kClock"></div>
    </div>
    <div id="kProd"></div><div id="kBoard">${skeleton(2)}</div>`;
  $('#kFecha').onchange = e => { K.fecha = e.target.value; K.sig = ''; K.known = null; pollCocina(); };
  $('#kRes').onclick = () => { K.resumen = !K.resumen; drawCocina(); };
  $('#kSnd').onclick = e => { K.sonido = !K.sonido; e.target.textContent = K.sonido ? '🔔' : '🔕'; if (K.sonido) beep(1); };
  $('#kFull').onclick = pantallaCompleta;
  $('#kAgot').onclick = () => modalAgotados(K.fecha);
  const tick = () => { const c = $('#kClock'); if (c) c.textContent = new Date().toLocaleTimeString('es-CR', { hour: '2-digit', minute: '2-digit' }); $$('[data-since]').forEach(timerUpd); };
  tick(); S.timers.push(setInterval(tick, 15000));
  await pollCocina(); S.timers.push(setInterval(pollCocina, CONFIG.POLL_COCINA_MS));
}
function pantallaCompleta() {
  document.body.classList.toggle('kiosk');
  try { if (document.body.classList.contains('kiosk')) document.documentElement.requestFullscreen?.(); else document.exitFullscreen?.(); } catch (e) { }
  if (document.body.classList.contains('kiosk')) toast('Toca “⛶” otra vez para salir', 'info');
}
function timerUpd(n) {
  const m = minsDesde(n.dataset.since); n.textContent = m < 60 ? `${m} min` : `${Math.floor(m / 60)}h ${m % 60}m`;
  n.classList.toggle('amber', m >= 8 && m < 15); n.classList.toggle('red', m >= 15);
}
async function pollCocina() {
  if (S.view !== 'cocina') return;
  let data; try { data = await rpc('bistro_cola', { p_fecha: K.fecha }); } catch (e) { return; }
  const sig = JSON.stringify(data.map(p => [p.id, p.estado, p.modificado]));
  const nuevos = K.known ? data.filter(p => !K.known.has(p.id)).map(p => p.id) : [];
  K.known = new Set(data.map(p => p.id));
  if (sig === K.sig) return;
  K.sig = sig; K.data = data; K.fresh = new Set(nuevos);
  if (nuevos.length && K.sonido) beep(2);
  drawCocina(); cargarFotos(data);
}
function drawCocina() {
  const ts = (S.menu?.tiempos || []).filter(t => t.activo !== false);
  $('#kTiempos').innerHTML = [`<button class="kchip ${K.tiempo === 'all' ? 'on' : ''}" onclick="K.tiempo='all';drawCocina()">Todos</button>`]
    .concat(ts.map(t => `<button class="kchip ${K.tiempo === t.id ? 'on' : ''}" onclick="K.tiempo='${t.id}';drawCocina()">${t.emoji || ''} ${esc(t.nombre)}</button>`)).join('');
  const d = K.data.filter(p => K.tiempo === 'all' || p.tiempo_id === K.tiempo);
  const col = (cls, titulo, e, lista, fn) => `<div class="${cls}"><div class="kcol-h">${e} ${titulo}<span class="n">${lista.length}</span></div>
    ${lista.length ? lista.map(fn).join('') : '<div class="empty" style="color:#7d736a">—</div>'}</div>`;
  const items = p => {
    const pr = p.items.filter(i => i.tipo === 'principal'), sd = p.items.filter(i => i.tipo !== 'principal');
    return `<ul class="kitems">${pr.map(i => `<li><span class="q">${i.cantidad}×</span><span>${esc(i.nombre)}${i.nota ? `<span class="nt">↳ ${esc(i.nota)}</span>` : ''}</span></li>`).join('')}
      ${sd.map(i => `<li class="ks"><span class="q">${i.cantidad}×</span><span>${esc(i.nombre)}${i.nota ? `<span class="nt">↳ ${esc(i.nota)}</span>` : ''}</span></li>`).join('')}</ul>
      ${p.peticion ? `<div class="knote">📝 ${esc(p.peticion)}</div>` : ''}`;
  };
  const card = (p, acts, since) => `<div class="kcard ${K.fresh?.has(p.id) ? 'fresh' : ''}">
    <div class="kh">${fotoImg(p.usuario_id, p.nombre, p.apellidos, 'av', 54)}
      <div><div class="num">#${p.numero}</div><div class="who">${esc(p.nombre)} ${esc(p.apellidos)}</div><div class="tt">${p.tiempo_emoji || ''} ${esc(p.tiempo)}</div></div>
      ${since ? `<span class="timer" data-since="${since}"></span>` : ''}</div>
    ${items(p)}<div class="kact">${acts}</div></div>`;
  if (K.resumen) {
    const agg = {}; d.filter(p => ['pendiente', 'preparando'].includes(p.estado)).forEach(p => p.items.forEach(i => agg[i.nombre] = (agg[i.nombre] || 0) + i.cantidad));
    $('#kProd').innerHTML = `<div class="prod"><div class="row sp"><b style="font-size:17px">📊 Por preparar (${K.tiempo === 'all' ? 'todos' : esc(ts.find(t => t.id === K.tiempo)?.nombre || '')})</b>
      <span class="tt" style="color:#a99d92">${d.length} pedidos · ${d.filter(p => p.estado === 'entregado').length} entregados</span></div>
      <div class="prod-grid">${Object.entries(agg).sort((a, b) => b[1] - a[1]).map(([n, q]) => `<div><span>${esc(n)}</span><b>${q}</b></div>`).join('') || '<span style="color:#7d736a">Nada pendiente 🎉</span>'}</div></div>`;
  } else $('#kProd').innerHTML = '';
  const enCola = d.filter(p => p.estado === 'pendiente'), prep = d.filter(p => p.estado === 'preparando');
  const listos = d.filter(p => p.estado === 'listo').concat(d.filter(p => p.estado === 'sirviendo'));
  $('#kBoard').innerHTML = `<div class="kds-cols">
    ${col('kc-new', 'Nuevos', '🆕', enCola, p => card(p, `<button class="btn info" onclick="kEstado('${p.id}','preparando')">▶ Empezar</button><button class="btn ok" style="flex:.5" onclick="kEstado('${p.id}','listo')">✓</button>`, p.creado))}
    ${col('kc-prep', 'Preparando', '🔥', prep, p => card(p, `<button class="btn ghost" style="flex:.35;color:#fff;border-color:#3a332d" onclick="kEstado('${p.id}','pendiente')">↩</button><button class="btn ok" onclick="kEstado('${p.id}','listo')">✓ Listo</button>`, p.t_preparando || p.creado))}
    ${col('kc-done', 'Listos', '✅', listos, p => card(p, p.estado === 'listo' ? `<button class="btn ghost" style="color:#fff;border-color:#3a332d" onclick="kEstado('${p.id}','preparando')">↩ Volver a preparar</button>` : '<div class="tt" style="padding:8px 0">🛎️ En servicio</div>', null))}
  </div>`;
  $$('[data-since]').forEach(timerUpd);
}
async function kEstado(id, est) {
  const p = K.data.find(x => x.id === id); if (p) { p.estado = est; if (est === 'preparando') p.t_preparando = p.t_preparando || new Date().toISOString(); drawCocina(); }
  try { await rpc('bistro_cambiar_estado', { p_id: id, p_estado: est }); K.sig = ''; pollCocina(); }
  catch (e) { toast(errMsg(e), 'err'); K.sig = ''; pollCocina(); }
}
async function modalAgotados(fecha) {
  let m; try { m = await rpc('bistro_menu', { p_desde: fecha, p_hasta: fecha }); } catch (e) { return toast(errMsg(e), 'err'); }
  const disp = m.disp.filter(d => d.fecha === fecha);
  openModal(`<div class="sheet-h"><h2>🚫 Agotados · ${fCorta(fecha)}</h2><button class="icon-btn" onclick="closeModal()">✕</button></div>
    <div class="sheet-b"><p class="small muted">Lo que marques como agotado deja de mostrarse para nuevos pedidos.</p>
    ${disp.length ? disp.map(d => { const p = m.platos.find(x => x.id === d.plato_id); if (!p) return ''; return `
      <div class="row sp" style="padding:10px 0;border-bottom:1px solid var(--line)"><span class="b">${esc(p.nombre)}</span>
      <label class="switch"><input type="checkbox" ${d.agotado ? 'checked' : ''} onchange="toggleAgotado('${fecha}','${p.id}',this.checked)"><span></span></label></div>`; }).join('') : '<div class="empty">No hay menú publicado para este día.</div>'}
    </div>`);
}
async function toggleAgotado(f, id, v) {
  try { await rpc('bistro_agotado', { p_fecha: f, p_plato: id, p_agotado: v }); toast(v ? 'Marcado como agotado' : 'Disponible de nuevo', v ? 'err' : 'ok'); }
  catch (e) { toast(errMsg(e), 'err'); }
}

/* =====================================================================
   SERVICIO · iPad en la zona de entrega
   ===================================================================== */
const V = { q: '', tiempo: 'all', data: [], sig: '', verEntregados: false };
async function viewServicio(el) {
  V.sig = '';
  if (!S.menu?.tiempos) { try { S.menu = await rpc('bistro_menu', { p_desde: hoy(), p_hasta: hoy() }); } catch (e) { } }
  el.innerHTML = `<div class="row wrap sp" style="gap:10px;margin-bottom:14px">
      <h1 class="display" style="font-size:28px">🛎️ Servicio <span class="muted" style="font-size:16px;font-family:var(--body)">· ${cap(fLarga(hoy()))}</span></h1>
      <div class="row" style="gap:6px"><button class="btn ghost sm" onclick="pantallaCompleta()">⛶</button></div></div>
    <div class="row wrap" style="gap:8px;margin-bottom:6px"><input class="inp grow" style="max-width:340px" id="vQ" placeholder="🔎 Buscar por nombre o #" value="${esc(V.q)}">
      <div class="row wrap" style="gap:6px" id="vTiempos"></div></div>
    <p class="tiny muted" style="margin:4px 0 12px">Desliza una tarjeta a la derecha → para avanzar · tócala para ver detalle, agregar o quitar cosas.</p>
    <div id="vBoard">${skeleton(2)}</div>`;
  $('#vQ').oninput = e => { V.q = e.target.value; drawServicio(); };
  await pollServicio(); S.timers.push(setInterval(pollServicio, CONFIG.POLL_SERVICIO_MS));
}
async function pollServicio() {
  if (S.view !== 'servicio') return;
  let data; try { data = await rpc('bistro_cola', { p_fecha: hoy() }); } catch (e) { return; }
  const sig = JSON.stringify(data.map(p => [p.id, p.estado, p.modificado]));
  const nuevosListos = V.data.length ? data.filter(p => p.estado === 'listo' && !V.data.some(o => o.id === p.id && o.estado === 'listo')) : [];
  if (sig === V.sig) return; V.sig = sig; V.data = data;
  if (nuevosListos.length) beep(1);
  if (!$('#modals').children.length) drawServicio();
  cargarFotos(data);
}
function drawServicio() {
  const ts = (S.menu?.tiempos || []).filter(t => t.activo !== false);
  $('#vTiempos').innerHTML = [`<button class="chip ${V.tiempo === 'all' ? 'on' : ''}" onclick="V.tiempo='all';drawServicio()">Todos</button>`]
    .concat(ts.map(t => `<button class="chip ${V.tiempo === t.id ? 'on' : ''}" onclick="V.tiempo='${t.id}';drawServicio()">${t.emoji || ''} ${esc(t.nombre)}</button>`)).join('');
  const q = V.q.trim().toLowerCase().replace('#', '');
  const d = V.data.filter(p => (V.tiempo === 'all' || p.tiempo_id === V.tiempo) && (!q || `${p.nombre} ${p.apellidos}`.toLowerCase().includes(q) || String(p.numero) === q));
  const listos = d.filter(p => p.estado === 'listo'), sirv = d.filter(p => p.estado === 'sirviendo');
  const cocina = d.filter(p => ['pendiente', 'preparando'].includes(p.estado)), entreg = d.filter(p => p.estado === 'entregado');
  const scard = p => `<div class="swipe" data-id="${p.id}" data-estado="${p.estado}">
      <div class="under ${p.estado === 'listo' ? 'serve' : ''}">${p.estado === 'listo' ? '🛎️ Servir →' : '✓ Entregar →'}</div>
      <div class="scard ${p.estado}">${fotoImg(p.usuario_id, p.nombre, p.apellidos, 'av', 92)}
        <div class="grow"><div class="row sp"><span class="num">#${p.numero}</span>${badge(p.estado)}</div>
          <div class="nm">${esc(p.nombre)} ${esc(p.apellidos)}</div>
          <ul>${p.items.map(i => `<li>${i.cantidad}× ${esc(i.nombre)}</li>`).join('')}</ul>
          ${p.peticion ? `<div class="note" style="margin-top:6px">📝 ${esc(p.peticion)}</div>` : ''}
          <div class="hint">${p.estado === 'listo' ? 'Desliza → para empezar a servir' : 'Desliza → para entregar y cerrar'}</div></div></div></div>`;
  const mini = p => `<div class="srv-mini" onclick="detalleServicio('${p.id}')">${fotoImg(p.usuario_id, p.nombre, p.apellidos, 'av', 42)}
      <div class="grow"><b>#${p.numero}</b> ${esc(p.nombre)} ${esc(p.apellidos)}<div class="tiny muted">${p.items.map(i => `${i.cantidad}× ${esc(i.nombre)}`).join(', ')}</div></div>${badge(p.estado)}</div>`;
  $('#vBoard').innerHTML = `
    <div class="sec-title" style="margin-top:4px"><h3>✅ Listos para servir · ${listos.length}</h3></div>
    ${listos.length ? `<div class="srv-grid">${listos.map(scard).join('')}</div>` : '<div class="empty" style="padding:16px"><div class="e">☕</div>Nada listo por ahora</div>'}
    ${sirv.length ? `<div class="sec-title"><h3>🛎️ Sirviendo · ${sirv.length}</h3></div><div class="srv-grid">${sirv.map(scard).join('')}</div>` : ''}
    <div class="sec-title"><h3>👩‍🍳 En cocina · ${cocina.length}</h3></div>
    ${cocina.length ? `<div class="srv-grid">${cocina.map(mini).join('')}</div>` : '<p class="muted small">Sin pedidos en preparación.</p>'}
    <div class="sec-title"><h3>📦 Entregados · ${entreg.length}</h3><button class="btn ghost sm" onclick="V.verEntregados=!V.verEntregados;drawServicio()">${V.verEntregados ? 'Ocultar' : 'Ver'}</button></div>
    ${V.verEntregados ? `<div class="srv-grid">${entreg.map(mini).join('')}</div>` : ''}`;
  $$('.swipe').forEach(bindSwipe);
}
function bindSwipe(w) {
  const card = $('.scard', w); let x0 = null, dx = 0, moved = false;
  card.addEventListener('pointerdown', e => { x0 = e.clientX; dx = 0; moved = false; card.style.transition = 'none'; card.setPointerCapture(e.pointerId); });
  card.addEventListener('pointermove', e => { if (x0 === null) return; dx = Math.max(0, e.clientX - x0); if (dx > 8) moved = true; card.style.transform = `translateX(${dx}px)`; });
  const end = async () => {
    if (x0 === null) return; x0 = null; card.style.transition = '';
    if (dx > w.offsetWidth * .42) {
      card.style.transform = `translateX(${w.offsetWidth}px)`;
      const est = w.dataset.estado === 'listo' ? 'sirviendo' : 'entregado';
      await sEstado(w.dataset.id, est);
    } else { card.style.transform = ''; if (!moved) detalleServicio(w.dataset.id); }
  };
  card.addEventListener('pointerup', end); card.addEventListener('pointercancel', () => { x0 = null; card.style.transform = ''; });
}
async function sEstado(id, est, silencioso) {
  try {
    await rpc('bistro_cambiar_estado', { p_id: id, p_estado: est });
    if (!silencioso) toast(est === 'entregado' ? '✓ Pedido entregado y cerrado' : est === 'sirviendo' ? '🛎️ Sirviendo' : 'Actualizado', 'ok');
  } catch (e) { toast(errMsg(e), 'err'); }
  V.sig = ''; await pollServicio();
}

/* ---------- detalle de servicio: editar, agregar, quitar, cerrar ---------- */
let D = null;
async function detalleServicio(id) {
  const p = V.data.find(x => x.id === id); if (!p) return;
  D = { p, items: p.items.map(i => ({ ...i })), dirty: false };
  if (!S.menuHoy || S.menuHoy.fecha !== hoy()) { try { S.menuHoy = { fecha: hoy(), ...(await rpc('bistro_menu', { p_desde: hoy(), p_hasta: hoy() })) }; } catch (e) { } }
  openModal(`<div class="sheet-h"><div class="grow"></div><button class="icon-btn" onclick="closeModal()">✕</button></div><div class="sheet-b srv-detail" id="dBody"></div><div class="sheet-f" id="dFoot"></div>`,
    { wide: true, onClose: () => { D = null; V.sig = ''; pollServicio(); } });
  drawDetalle();
}
function drawDetalle() {
  const p = D.p, editable = ['listo', 'sirviendo'].includes(p.estado), tot = D.items.reduce((a, i) => a + i.precio * i.cantidad, 0);
  $('#dBody').innerHTML = `<div class="center">
      <img class="bigav" data-uid="${p.usuario_id}" src="${S.fotos[p.usuario_id]?.src || avatarSVG(p.nombre, p.apellidos)}">
      <h2 class="display mt" style="font-size:26px">${esc(p.nombre)} ${esc(p.apellidos)}</h2>
      <div class="row" style="justify-content:center;gap:8px;margin-top:6px"><span class="display b" style="color:var(--accent);font-size:22px">#${p.numero}</span>${badge(p.estado)}<span class="chip">${p.tiempo_emoji || ''} ${esc(p.tiempo)}</span></div></div>
    ${p.peticion ? `<div class="note mt">📝 ${esc(p.peticion)}</div>` : ''}
    <div class="sec-title"><h3>Pedido</h3>${editable ? '<button class="btn soft sm" onclick="agregarItemServicio()">＋ Agregar</button>' : ''}</div>
    ${D.items.map((i, k) => `<div class="eitem ${i.agregado_servicio ? 'added' : ''}"><div class="grow"><b>${esc(i.nombre)}</b>${i.agregado_servicio ? ' <span class="tiny" style="color:#7a3db8">agregado</span>' : ''}${i.nota ? `<div class="tiny muted">${esc(i.nota)}</div>` : ''}<div class="tiny muted">${money(i.precio)} c/u</div></div>
      ${editable ? `<div class="step"><button onclick="dCant(${k},-1)">−</button><span>${i.cantidad}</span><button class="add" onclick="dCant(${k},1)">+</button></div>` : `<b>${i.cantidad}×</b>`}</div>`).join('') || '<p class="muted">Sin platos</p>'}
    <div class="row sp mt"><span class="muted">Total</span><b style="font-size:22px">${money(tot)}</b></div>
    ${!editable && p.estado !== 'entregado' ? '<div class="lockmsg" style="background:var(--info-soft)">👩‍🍳 Este pedido aún está en cocina. Podrás modificarlo cuando esté listo.</div>' : ''}`;
  const f = $('#dFoot');
  if (D.dirty) f.innerHTML = `<button class="btn ghost" onclick="D.items=D.p.items.map(i=>({...i}));D.dirty=false;drawDetalle()">Descartar</button><button class="btn acc grow" onclick="guardarServicio()">💾 Guardar cambios</button>`;
  else if (editable) f.innerHTML = `<div class="slider" id="dSlider"><div class="lbl">Desliza para entregar ✓</div><div class="knob">→</div></div>`;
  else if (p.estado === 'entregado') f.innerHTML = `<button class="btn ghost block" onclick="sEstado('${p.id}','sirviendo').then(()=>closeModal())">↩ Reabrir pedido</button>`;
  else f.innerHTML = `<button class="btn ghost block" onclick="closeModal()">Cerrar</button>`;
  if ($('#dSlider')) bindSlider($('#dSlider'), async () => { await sEstado(p.id, 'entregado'); closeModal(); });
}
function bindSlider(sl, onDone) {
  const k = $('.knob', sl); let x0 = null, max = 0, dx = 0;
  k.addEventListener('pointerdown', e => { x0 = e.clientX; max = sl.offsetWidth - k.offsetWidth - 10; k.style.transition = 'none'; k.setPointerCapture(e.pointerId); });
  k.addEventListener('pointermove', e => { if (x0 === null) return; dx = Math.min(max, Math.max(0, e.clientX - x0)); k.style.transform = `translateX(${dx}px)`; $('.lbl', sl).style.opacity = 1 - dx / max; });
  k.addEventListener('pointerup', () => {
    if (x0 === null) return; x0 = null; k.style.transition = 'transform .25s';
    if (dx >= max * .9) { k.style.transform = `translateX(${max}px)`; k.textContent = '✓'; onDone(); } else { k.style.transform = ''; $('.lbl', sl).style.opacity = 1; }
  });
}
function dCant(k, d) { D.items[k].cantidad += d; if (D.items[k].cantidad <= 0) D.items.splice(k, 1); D.dirty = true; drawDetalle(); }
function agregarItemServicio() {
  const M = S.menuHoy || { platos: [], disp: [], categorias: [] };
  const disp = new Set(M.disp.filter(d => d.fecha === hoy() && !d.agotado).map(d => d.plato_id));
  const cats = M.categorias.filter(c => c.tiempo_id === D.p.tiempo_id);
  const lista = M.platos.filter(p => p.activo !== false && (disp.has(p.id) || p.tipo !== 'principal') && cats.some(c => c.id === p.categoria_id));
  const ov = openModal(`<div class="sheet-h"><h2>＋ Agregar al pedido</h2><button class="icon-btn" onclick="closeModal()">✕</button></div>
    <div class="sheet-b"><div class="sides">${lista.map(p => `<div class="side" onclick="addServ('${p.id}')">${esc(p.nombre)} <span class="px">${money(p.precio)}</span></div>`).join('') || '<p class="muted">No hay platos para este tiempo.</p>'}</div>
    <hr class="sep"><b>Otro (libre)</b><div class="row mt"><input class="inp grow" id="libN" placeholder="Ej.: natilla, tortilla extra"><input class="inp" id="libP" type="number" inputmode="numeric" placeholder="Precio" style="width:120px"></div>
    <button class="btn ghost block mt" onclick="addLibre()">Agregar</button></div>`);
}
function addServ(id) {
  const p = S.menuHoy.platos.find(x => x.id === id), dp = S.menuHoy.disp.find(d => d.plato_id === id && d.fecha === hoy());
  const ex = D.items.find(i => i.plato_id === id && !i.nota);
  if (ex) ex.cantidad++; else D.items.push({ plato_id: id, nombre: p.nombre, tipo: p.tipo, precio: Number(dp?.precio ?? p.precio), cantidad: 1, agregado_servicio: true });
  D.dirty = true; closeModal(); drawDetalle();
}
function addLibre() {
  const n = $('#libN').value.trim(); if (!n) return toast('Escribe qué se agrega', 'err');
  D.items.push({ plato_id: null, nombre: n, tipo: 'extra', categoria: 'Adicional', precio: Number($('#libP').value || 0), cantidad: 1, agregado_servicio: true });
  D.dirty = true; closeModal(); drawDetalle();
}
async function guardarServicio() {
  try {
    const r = await rpc('bistro_servicio_editar', { p_id: D.p.id, p_items: D.items.map(i => ({ plato_id: i.plato_id, nombre: i.nombre, tipo: i.tipo, categoria: i.categoria, precio: i.precio, cantidad: i.cantidad, nota: i.nota, agregado_servicio: !!i.agregado_servicio })) });
    D.p = r; D.items = r.items.map(i => ({ ...i })); D.dirty = false; toast('Cambios guardados', 'ok'); drawDetalle();
  } catch (e) { toast(errMsg(e), 'err'); }
}
</script>
<script>
/* =====================================================================
   MENÚ (perfil cocina): disponibilidad por día + catálogo
   ===================================================================== */
const MM = { tab: 'disp', semana: null, cat: null, mat: {}, orig: '', dirty: false };
async function viewMenu(el) {
  MM.semana = MM.semana || ymd(weekStart(new Date()));
  el.innerHTML = `<div class="row wrap sp"><h1 class="display" style="font-size:28px">📋 Menú</h1>
      <div class="tabs"><button class="tab ${MM.tab === 'disp' ? 'on' : ''}" onclick="MM.tab='disp';viewMenu($('#main'))">🗓️ ¿Qué hay cada día?</button>
      <button class="tab ${MM.tab === 'cat' ? 'on' : ''}" onclick="MM.tab='cat';viewMenu($('#main'))">🍲 Platos y categorías</button></div></div>
    <div id="mmBody" class="mt">${skeleton()}</div>`;
  if (MM.tab === 'disp') return drawDisponibilidad();
  drawCatalogo();
}
function diasSemana(ws) { const ds = S.cfg.dias_servicio || [1, 2, 3, 4, 5]; return [0, 1, 2, 3, 4, 5, 6].map(i => ymd(addDays(pd(ws), i))).filter(d => ds.includes(isoDow(pd(d)))); }
async function drawDisponibilidad() {
  const dias = diasSemana(MM.semana), b = $('#mmBody');
  let m; try { m = await rpc('bistro_menu', { p_desde: dias[0] || MM.semana, p_hasta: dias.at(-1) || MM.semana }); } catch (e) { b.innerHTML = esc(errMsg(e)); return; }
  MM.cat = m; MM.mat = {};
  dias.forEach(d => MM.mat[d] = {}); m.disp.forEach(x => { if (MM.mat[x.fecha]) MM.mat[x.fecha][x.plato_id] = x.agotado ? 'ag' : 'on'; });
  MM.orig = JSON.stringify(MM.mat); MM.dirty = false; renderMatriz();
}
function renderMatriz() {
  const m = MM.cat, dias = Object.keys(MM.mat), b = $('#mmBody'), ws = pd(MM.semana);
  const esPasada = d => d < hoy();
  let rows = '';
  m.tiempos.forEach(t => {
    const cats = m.categorias.filter(c => c.tiempo_id === t.id);
    const pls = cats.flatMap(c => m.platos.filter(p => p.categoria_id === c.id && p.activo !== false).map(p => ({ ...p, c })));
    if (!pls.length) return;
    rows += `<tr class="grp"><td colspan="${dias.length + 1}">${t.emoji || ''} ${esc(t.nombre)}</td></tr>`;
    pls.forEach(p => {
      rows += `<tr><th class="pl" onclick="mFila('${p.id}')"><div>${esc(p.nombre)}</div><div class="tiny muted">${p.c.emoji || ''} ${esc(p.c.nombre)} · ${money(p.precio)}${p.tipo !== 'principal' ? ' · ' + (p.tipo === 'guarnicion' ? 'acomp.' : 'adicional') : ''}</div></th>
        ${dias.map(d => { const v = MM.mat[d][p.id]; return `<td><button class="cell ${v || ''}" ${esPasada(d) ? 'disabled style="opacity:.4"' : ''} onclick="mCelda('${d}','${p.id}')">${v === 'on' ? '✓' : v === 'ag' ? 'AGOT.' : ''}</button></td>`; }).join('')}</tr>`;
    });
  });
  b.innerHTML = `<div class="row wrap sp" style="gap:8px">
      <div class="row" style="gap:6px"><button class="btn ghost sm" onclick="mSemana(-7)">←</button>
        <b style="min-width:180px;text-align:center">Semana del ${ws.getDate()} ${MN[ws.getMonth()]}</b><button class="btn ghost sm" onclick="mSemana(7)">→</button></div>
      <div class="row wrap" style="gap:6px"><button class="btn ghost sm" onclick="mCopiarAnterior()">⧉ Copiar semana anterior</button>
        <button class="btn ghost sm" onclick="mRepetir()">🔁 Repetir en próximas semanas</button>
        <button class="btn acc sm" id="mSave" ${MM.dirty ? '' : 'disabled'} onclick="mGuardar()">💾 Guardar</button></div></div>
    <p class="tiny muted">Toca una celda: vacío → ✓ disponible → agotado. Toca el nombre del plato para marcar toda la fila o el día para toda la columna.</p>
    ${rows ? `<div class="matrix-wrap"><table class="matrix"><thead><tr><th class="pl">Plato</th>${dias.map(d => { const x = pd(d); return `<th onclick="mColumna('${d}')"><div class="tiny muted" style="text-transform:uppercase">${DN[x.getDay()]}</div><div class="b">${x.getDate()}</div></th>`; }).join('')}</tr></thead><tbody>${rows}</tbody></table></div>`
      : `<div class="empty"><div class="e">🍲</div>Primero crea tus platos en “Platos y categorías”.<br><button class="btn acc mt" onclick="MM.tab='cat';viewMenu($('#main'))">Crear platos</button></div>`}`;
}
function mMark() { MM.dirty = JSON.stringify(MM.mat) !== MM.orig; const s = $('#mSave'); if (s) s.disabled = !MM.dirty; }
function mCelda(d, id) { const v = MM.mat[d][id]; if (!v) MM.mat[d][id] = 'on'; else if (v === 'on') MM.mat[d][id] = 'ag'; else delete MM.mat[d][id]; mMark(); renderMatriz(); }
function mFila(id) { const ds = Object.keys(MM.mat).filter(d => d >= hoy()); const all = ds.every(d => MM.mat[d][id]); ds.forEach(d => all ? delete MM.mat[d][id] : MM.mat[d][id] = MM.mat[d][id] || 'on'); mMark(); renderMatriz(); }
function mColumna(d) { if (d < hoy()) return; const ids = MM.cat.platos.filter(p => p.activo !== false).map(p => p.id); const all = ids.every(i => MM.mat[d][i]); ids.forEach(i => all ? delete MM.mat[d][i] : MM.mat[d][i] = MM.mat[d][i] || 'on'); mMark(); renderMatriz(); }
async function mSemana(n) { if (MM.dirty && !await confirmar('Cambios sin guardar', '¿Salir de esta semana sin guardar?', 'Salir')) return; MM.semana = ymd(addDays(pd(MM.semana), n)); drawDisponibilidad(); }
async function mCopiarAnterior() {
  const prev = ymd(addDays(pd(MM.semana), -7)), dPrev = diasSemana(prev);
  try {
    const m = await rpc('bistro_menu', { p_desde: dPrev[0], p_hasta: dPrev.at(-1) });
    Object.keys(MM.mat).forEach(d => { if (d < hoy()) return; const src = ymd(addDays(pd(d), -7)); MM.mat[d] = {}; m.disp.filter(x => x.fecha === src).forEach(x => MM.mat[d][x.plato_id] = 'on'); });
    mMark(); renderMatriz(); toast('Copiado. Revisa y guarda 💾', 'info');
  } catch (e) { toast(errMsg(e), 'err'); }
}
function payloadDisp(map) { const o = {}; Object.entries(map).forEach(([d, v]) => o[d] = Object.entries(v).map(([plato_id, s]) => ({ plato_id, agotado: s === 'ag' }))); return o; }
async function mGuardar() {
  const fechas = Object.keys(MM.mat).filter(d => d >= hoy());
  try { await rpc('bistro_disponibilidad_guardar', { p_fechas: fechas, p_items: payloadDisp(MM.mat) }); MM.orig = JSON.stringify(MM.mat); mMark(); toast('Menú publicado ✅', 'ok'); }
  catch (e) { toast(errMsg(e), 'err'); }
}
async function mRepetir() {
  const n = await pedirTexto('Repetir esta semana', '¿En cuántas semanas siguientes? (1-8)', '3'); if (n === null) return;
  const k = Math.min(8, Math.max(1, parseInt(n) || 0)); if (!k) return;
  const fechas = [], items = {};
  for (let w = 1; w <= k; w++) Object.keys(MM.mat).forEach(d => { const nd = ymd(addDays(pd(d), 7 * w)); fechas.push(nd); items[nd] = Object.keys(MM.mat[d]).map(plato_id => ({ plato_id, agotado: false })); });
  try { await rpc('bistro_disponibilidad_guardar', { p_fechas: fechas, p_items: items }); toast(`Menú repetido en ${k} semana(s) 🔁`, 'ok'); } catch (e) { toast(errMsg(e), 'err'); }
}

/* ---------- catálogo ---------- */
async function drawCatalogo() {
  const b = $('#mmBody');
  try { MM.cat = await rpc('bistro_menu', { p_desde: hoy(), p_hasta: hoy() }); } catch (e) { b.innerHTML = esc(errMsg(e)); return; }
  const m = MM.cat, TIPO = { principal: 'Plato', guarnicion: 'Acompañamiento', extra: 'Adicional' };
  b.innerHTML = `<div class="row sp"><p class="small muted" style="margin:0">Organiza: <b>Tiempo de comida</b> (con su hora de corte) → <b>Categoría</b> → <b>Platos</b> con precio.</p>
      <button class="btn acc sm" onclick="formCat('tiempo')">＋ Tiempo de comida</button></div>
    ${m.tiempos.map(t => `<div class="tree-t mt ${t.activo === false ? 'pl-row inact' : ''}">
      <div class="row"><span style="font-size:26px">${t.emoji || '🍽️'}</span><div class="grow"><b style="font-size:17px">${esc(t.nombre)}</b>${t.activo === false ? ' <span class="badge st-inactivo">inactivo</span>' : ''}
        <div class="tiny muted">${t.hora_corte ? `Corte ${hora12(t.hora_corte)}${t.dias_antes ? `, ${t.dias_antes} día(s) antes` : ' del mismo día'}` : 'Sin hora de corte'}</div></div>
        <button class="btn ghost sm" onclick="formCat('tiempo','${t.id}')">✏️</button><button class="btn soft sm" onclick="formCat('categoria',null,'${t.id}')">＋ Categoría</button></div>
      ${m.categorias.filter(c => c.tiempo_id === t.id).map(c => `<div class="tree-c">
        <div class="row"><b class="grow">${c.emoji || '🍴'} ${esc(c.nombre)}${c.activo === false ? ' <span class="badge st-inactivo">inactiva</span>' : ''}</b>
          <button class="btn ghost sm" onclick="formCat('categoria','${c.id}')">✏️</button><button class="btn soft sm" onclick="formCat('plato',null,'${c.id}')">＋ Plato</button></div>
        ${m.platos.filter(p => p.categoria_id === c.id).map(p => `<div class="pl-row ${p.activo === false ? 'inact' : ''}">
          <div class="grow"><b>${esc(p.nombre)}</b> <span class="typ">${TIPO[p.tipo]}</span>${p.descripcion ? `<div class="tiny muted">${esc(p.descripcion)}</div>` : ''}</div>
          <b>${money(p.precio)}</b><button class="icon-btn" style="width:34px;height:34px;font-size:15px" onclick="formCat('plato','${p.id}')">✏️</button></div>`).join('') || '<div class="tiny muted mt">Sin platos</div>'}
      </div>`).join('')}</div>`).join('') || '<div class="empty"><div class="e">🍽️</div>Crea tu primer tiempo de comida (ej. Desayuno, Almuerzo).</div>'}`;
}
function formCat(tipo, id, padre) {
  const m = MM.cat, src = id ? (tipo === 'tiempo' ? m.tiempos : tipo === 'categoria' ? m.categorias : m.platos).find(x => x.id === id) : {};
  const x = { activo: true, orden: 0, ...src };
  const tit = { tiempo: 'Tiempo de comida', categoria: 'Categoría', plato: 'Plato' }[tipo];
  let campos = `<div class="grid2"><div><label class="f">Nombre</label><input class="inp" id="fcN" value="${esc(x.nombre || '')}"></div>`;
  if (tipo !== 'plato') campos += `<div><label class="f">Emoji</label><input class="inp" id="fcE" value="${esc(x.emoji || (tipo === 'tiempo' ? '🍽️' : '🍴'))}" maxlength="4"></div></div>`;
  if (tipo === 'tiempo') campos += `<div class="grid2"><div><label class="f">Hora de corte (vacío = sin corte)</label><input class="inp" type="time" id="fcH" value="${(x.hora_corte || '').slice(0, 5)}"></div>
    <div><label class="f">¿Cuándo es el corte?</label><select class="inp" id="fcD">${[0, 1, 2].map(n => `<option value="${n}" ${+x.dias_antes === n ? 'selected' : ''}>${n === 0 ? 'El mismo día' : n === 1 ? 'El día anterior' : '2 días antes'}</option>`).join('')}</select></div></div>`;
  if (tipo === 'categoria') campos += `<label class="f">Tiempo de comida</label><select class="inp" id="fcP">${m.tiempos.map(t => `<option value="${t.id}" ${(x.tiempo_id || padre) === t.id ? 'selected' : ''}>${esc(t.nombre)}</option>`).join('')}</select>`;
  if (tipo === 'plato') campos += `<div><label class="f">Precio (${S.cfg.moneda || '₡'})</label><input class="inp" id="fcPr" type="number" inputmode="numeric" value="${x.precio ?? ''}"></div></div>
    <label class="f">Descripción (opcional)</label><input class="inp" id="fcDs" value="${esc(x.descripcion || '')}">
    <div class="grid2"><div><label class="f">Tipo</label><select class="inp" id="fcT">
      <option value="principal" ${x.tipo === 'principal' || !x.tipo ? 'selected' : ''}>Plato principal</option>
      <option value="guarnicion" ${x.tipo === 'guarnicion' ? 'selected' : ''}>Acompañamiento / guarnición</option>
      <option value="extra" ${x.tipo === 'extra' ? 'selected' : ''}>Adicional</option></select></div>
    <div><label class="f">Categoría</label><select class="inp" id="fcP">${m.categorias.map(c => `<option value="${c.id}" ${(x.categoria_id || padre) === c.id ? 'selected' : ''}>${esc(m.tiempos.find(t => t.id === c.tiempo_id)?.nombre || '')} › ${esc(c.nombre)}</option>`).join('')}</select></div></div>`;
  campos += `<div class="grid2"><div><label class="f">Orden</label><input class="inp" id="fcO" type="number" value="${x.orden || 0}"></div>
    <div><label class="f">Estado</label><label class="row" style="height:50px"><span class="switch"><input type="checkbox" id="fcA" ${x.activo !== false ? 'checked' : ''}><span></span></span> Activo</label></div></div>`;
  const ov = openModal(`<div class="sheet-h"><h2>${id ? 'Editar' : 'Nuevo'} · ${tit}</h2><button class="icon-btn" onclick="closeModal()">✕</button></div>
    <div class="sheet-b">${campos}</div><div class="sheet-f">${id ? '<button class="btn ghost" id="fcDel">🗑️</button>' : ''}<button class="btn acc grow" id="fcOk">Guardar</button></div>`);
  $('#fcOk', ov).onclick = async () => {
    const p = { id: id || null, nombre: $('#fcN').value.trim(), orden: +$('#fcO').value || 0, activo: $('#fcA').checked };
    if (!p.nombre) return toast('Falta el nombre', 'err');
    if (tipo !== 'plato') p.emoji = $('#fcE').value.trim();
    if (tipo === 'tiempo') { p.hora_corte = $('#fcH').value || null; p.dias_antes = +$('#fcD').value; }
    if (tipo === 'categoria') p.tiempo_id = $('#fcP').value;
    if (tipo === 'plato') { p.precio = +$('#fcPr').value || 0; p.descripcion = $('#fcDs').value.trim(); p.tipo = $('#fcT').value; p.categoria_id = $('#fcP').value; }
    try { await rpc('bistro_catalogo_guardar', { p_tipo: tipo, p }); closeModal(); toast('Guardado', 'ok'); S.menu = null; drawCatalogo(); } catch (e) { toast(errMsg(e), 'err'); }
  };
  if (id) $('#fcDel', ov).onclick = async () => {
    if (!await confirmar('¿Eliminar?', tipo === 'plato' ? 'El plato se eliminará del catálogo. Los pedidos anteriores conservan su nombre y precio.' : 'Se eliminará junto con todo lo que contiene. Si solo quieres ocultarlo, desactívalo.', 'Eliminar', 'danger')) return;
    try { await rpc('bistro_catalogo_eliminar', { p_tipo: tipo, p_id: id }); closeAllModals(); toast('Eliminado'); S.menu = null; drawCatalogo(); } catch (e) { toast(errMsg(e), 'err'); }
  };

/* =====================================================================
   ADMINISTRACIÓN
   ===================================================================== */
const AD = { tab: 'solicitudes', q: '', users: [], rep: null };
async function viewAdmin(el) {
  el.innerHTML = `<div class="row wrap sp"><h1 class="display" style="font-size:28px">⚙️ Administración</h1>
    <div class="tabs">${[['solicitudes', '📥 Solicitudes'], ['usuarios', '👥 Usuarios'], ['reportes', '📊 Consumo'], ['config', '🎨 Configuración']]
      .map(([k, l]) => `<button class="tab ${AD.tab === k ? 'on' : ''}" onclick="AD.tab='${k}';viewAdmin($('#main'))">${l}<span id="badge-${k}"></span></button>`).join('')}</div></div>
    <div id="adBody" class="mt">${skeleton()}</div>`;

const ROLES = [['cocina', '👩‍🍳 Cocina'], ['servicio', '🛎️ Servicio'], ['admin', '⚙️ Admin']];
function drawSolicitudes() {
  const p = AD.users.filter(u => u.estado === 'pendiente');
  $('#adBody').innerHTML = p.length ? p.map(u => `<div class="req">
      ${fotoImg(u.id, u.nombre, u.apellidos, 'av', 110)}

async function drawReporte() {
  const now = new Date(); AD.rep = AD.rep || { desde: ymd(new Date(now.getFullYear(), now.getMonth(), 1)), hasta: hoy(), solo: true };

  const lista = Object.values(porU).sort((a, b) => a.nombre.localeCompare(b.nombre)), tot = lista.reduce((a, x) => a + x.total, 0);

    <tbody>${lista.map(x => `<tr><td class="b">${esc(x.nombre)}</td><td class="muted">${esc(x.correo)}</td><td class="n">${x.n}</td><td class="n b">${money(x.total)}</td></tr>`).join('') || '<tr><td colspan="4" class="center muted">Sin datos</td></tr>'}</tbody></table></div>`;
}
function csvReporte(tipo) {
  const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const rows = tipo === 'resumen'
    ? [['Colaborador', 'Correo', 'Pedidos', 'Total']].concat(AD.repData.lista.map(x => [x.nombre, x.correo, x.n, x.total]))
    : [['Fecha', 'Tiempo', '#', 'Colaborador', 'Correo', 'Detalle', 'Estado', 'Total']].concat(AD.repData.data.map(r => [r.fecha, r.tiempo, r.numero, r.nombre, r.correo, r.items, r.estado, r.total]));
  const blob = new Blob(['﻿' + rows.map(r => r.map(q).join(';')).join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `consumo_${tipo}_${AD.rep.desde}_${AD.rep.hasta}.csv`; a.click();
}
